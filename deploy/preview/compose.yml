services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: angui
      POSTGRES_USER: angui
      POSTGRES_PASSWORD: angui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angui -d angui"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: "no"
    command: ["migration", "up"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${PREVIEW_DATABASE_URL:-postgres://angui:angui@database:5432/angui}
      RUST_LOG: ${RUST_LOG:-info}

  bootstrap:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: "no"
    command: ["angui-admin", "bootstrap-demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${PREVIEW_DATABASE_URL:-postgres://angui:angui@database:5432/angui}
      ANGUI_DEMO_PASSWORD: ${PREVIEW_DEMO_PASSWORD:?PREVIEW_DEMO_PASSWORD is required}

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ANGUI_HOST: 0.0.0.0
      ANGUI_PORT: 8080
      ANGUI_FRONTEND_ORIGIN: ${PREVIEW_ORIGIN:?PREVIEW_ORIGIN is required}
      DATABASE_URL: ${PREVIEW_DATABASE_URL:-postgres://angui:angui@database:5432/angui}
      RUST_LOG: ${RUST_LOG:-info}

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${PREVIEW_BIND_ADDRESS:-0.0.0.0}:${PREVIEW_PORT:?PREVIEW_PORT is required}:80

volumes:
  postgres-data:
