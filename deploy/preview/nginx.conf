map $args $amap_forward_args {
    ""      "jscode=$AMAP_JSAPI_SECURITY_CODE";
    default "$args&jscode=$AMAP_JSAPI_SECURITY_CODE";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AMap JSAPI v2 service proxy. The upstream is fixed so this cannot become
    # an open proxy; the security code is injected only when the container
    # starts and is never written to the frontend bundle.
    location ^~ /_AMapService/ {
        access_log off;
        limit_except GET {
            deny all;
        }
        if ($arg_jscode != "") {
            return 400;
        }
        rewrite ^/_AMapService/(.*)$ /$1?$amap_forward_args break;
        proxy_pass https://restapi.amap.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host restapi.amap.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
