services:
  traefik:
    # Docker Engine on the preview host requires API v1.40+. Traefik v3.6.16+
    # supports that provider minimum; pin a current patch release for stable
    # Docker socket compatibility instead of the older v3.5 line.
    image: traefik:v3.6.22
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=angui-proxy
      - --entrypoints.web.address=:80
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - angui-proxy

networks:
  angui-proxy:
    name: angui-proxy
