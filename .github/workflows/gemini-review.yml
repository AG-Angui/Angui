name: gemini-review

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target has secrets, so only trusted default-branch scripts
      # are checked out. PR code is read as a diff through the GitHub API.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Check Gemini configuration
        id: config
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::GEMINI_API_KEY is not configured; review skipped."
          fi

      - name: Review pull request
        if: steps.config.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROVIDER: gemini
          REVIEW_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_API_BASE: ${{ vars.GEMINI_API_BASE }}
          REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-2.5-flash' }}
          REVIEW_MAX_DIFF_CHARS: ${{ vars.REVIEW_MAX_DIFF_CHARS || '120000' }}
        run: node .github/scripts/review.mjs
