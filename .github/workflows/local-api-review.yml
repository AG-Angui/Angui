name: local-api-review

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: local-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'local-review'))
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Check local API configuration
        id: config
        shell: bash
        env:
          LOCAL_REVIEW_API_BASE: ${{ secrets.LOCAL_REVIEW_API_BASE }}
        run: |
          if [ -n "${LOCAL_REVIEW_API_BASE}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::LOCAL_REVIEW_API_BASE is not configured; review skipped."
          fi

      - name: Review pull request
        if: steps.config.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROVIDER: openai-compatible
          REVIEW_API_BASE: ${{ secrets.LOCAL_REVIEW_API_BASE }}
          REVIEW_API_KEY: ${{ secrets.LOCAL_REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ vars.LOCAL_REVIEW_MODEL || 'qwen3-coder' }}
          REVIEW_MAX_DIFF_CHARS: ${{ vars.REVIEW_MAX_DIFF_CHARS || '120000' }}
        run: node .github/scripts/review.mjs
