name: pr-preview

# Only internal PRs are deployed. The deployment host never executes artifacts
# from an external fork, even after its CI workflow succeeds.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: angui-preview
    timeout-minutes: 25
    environment:
      name: ${{ vars.PREVIEW_ENVIRONMENT || 'preview' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download backend artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: angui-linux-${{ github.event.workflow_run.head_sha }}
          path: .preview/backend
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download frontend artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: angui-frontend-${{ github.event.workflow_run.head_sha }}
          path: .preview/frontend
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compute pull request preview identity
        id: preview
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_SCHEME: ${{ vars.PREVIEW_SCHEME || 'https' }}
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER}"
          test -n "${HEAD_SHA}"
          test -n "${PREVIEW_BASE_DOMAIN}"
          short_sha="${HEAD_SHA:0:12}"
          {
            echo "id=pr-${PR_NUMBER}"
            echo "project=pr-${PR_NUMBER}"
            echo "router=pr-${PR_NUMBER}"
            echo "host=pr-${PR_NUMBER}-${short_sha}.${PREVIEW_BASE_DOMAIN}"
            echo "origin=${PREVIEW_SCHEME}://pr-${PR_NUMBER}-${short_sha}.${PREVIEW_BASE_DOMAIN}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate this deployment's temporary login password
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          # Hex encoding yields a printable 48-character value that meets the
          # bootstrap command's 12-256 character requirement without escaping.
          printf 'password=%s\n' "$(openssl rand -hex 24)" >> "${GITHUB_OUTPUT}"

      - name: Deploy pull request preview locally
        shell: bash
        env:
          PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/var/github-runner/angui/previews' }}
          PREVIEW_ID: ${{ steps.preview.outputs.id }}
          PREVIEW_PROJECT: ${{ steps.preview.outputs.project }}
          PREVIEW_ROUTER: ${{ steps.preview.outputs.router }}
          PREVIEW_HOST: ${{ steps.preview.outputs.host }}
          PREVIEW_ORIGIN: ${{ steps.preview.outputs.origin }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_PROXY_NETWORK: ${{ vars.PREVIEW_PROXY_NETWORK || 'angui-proxy' }}
          PREVIEW_RUNTIME_IMAGE: ${{ vars.PREVIEW_RUNTIME_IMAGE || 'angui-preview-runtime:bookworm' }}
          PREVIEW_DEMO_PASSWORD: ${{ steps.credentials.outputs.password }}
          AMAP_WEBSERVICE_KEY: ${{ secrets.AMAP_WEBSERVICE_KEY }}
          PREVIEW_REPOSITORY_DIR: ${{ github.workspace }}
          PREVIEW_BACKEND_DIR: ${{ github.workspace }}/.preview/backend
          PREVIEW_FRONTEND_DIR: ${{ github.workspace }}/.preview/frontend
        run: |
          chmod +x deploy/preview/deploy-local.sh
          deploy/preview/deploy-local.sh deploy

      - name: Write pull request preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.origin }}
        run: echo "PR preview deployed at ${PREVIEW_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Reply with temporary preview access
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.origin }}
          PREVIEW_PASSWORD: ${{ steps.credentials.outputs.password }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          comment_body="$(cat <<EOF
          ## Preview ready

          The preview for this build is available at ${PREVIEW_URL}.

          Temporary demo accounts (all use the password \`${PREVIEW_PASSWORD}\`):

          | Role | Email |
          | --- | --- |
          | Family | \`family@demo.invalid\` |
          | Commander | \`commander@demo.invalid\` |
          | Volunteer | \`volunteer@demo.invalid\` |
          | Learner | \`learner@demo.invalid\` |
          | Administrator | \`admin@demo.invalid\` |

          > These accounts and all preview data belong only to this deployment. The next preview deployment resets the SQLite database and invalidates these credentials.
          EOF
          )"
          json_escape() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            value="${value//$'\n'/\\n}"
            value="${value//$'\r'/\\r}"
            value="${value//$'\t'/\\t}"
            printf '%s' "${value}"
          }
          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"body\":\"$(json_escape "${comment_body}")\"}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
