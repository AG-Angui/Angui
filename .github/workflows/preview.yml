name: preview

# workflow_run is intentional: deployment uses the trusted default-branch
# workflow and accepts artifacts only from a successful push-triggered CI run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]
  delete:

permissions:
  contents: read

concurrency:
  group: preview-branch-${{ github.event.workflow_run.head_branch || github.event.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.pull_requests[0].number == null &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: angui-preview
    timeout-minutes: 25
    environment:
      name: ${{ vars.PREVIEW_ENVIRONMENT || 'preview' }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Deployment tooling is always loaded from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download backend artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: angui-linux-${{ github.event.workflow_run.head_sha }}
          path: .preview/backend
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download frontend artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: angui-frontend-${{ github.event.workflow_run.head_sha }}
          path: .preview/frontend
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compute branch preview identity
        id: preview
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_SCHEME: ${{ vars.PREVIEW_SCHEME || 'https' }}
        run: |
          set -euo pipefail
          test -n "${PREVIEW_BASE_DOMAIN}"
          slug="$(printf '%s' "${HEAD_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-48)"
          test -n "${slug}"
          {
            echo "id=branch-${slug}"
            echo "project=branch-${slug}"
            echo "router=branch-${slug}"
            echo "host=${slug}.${PREVIEW_BASE_DOMAIN}"
            echo "origin=${PREVIEW_SCHEME}://${slug}.${PREVIEW_BASE_DOMAIN}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate this deployment's temporary login password
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'password=%s\n' "$(openssl rand -hex 24)" >> "${GITHUB_OUTPUT}"

      - name: Deploy branch preview locally
        shell: bash
        env:
          PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/var/github-runner/angui/previews' }}
          PREVIEW_ID: ${{ steps.preview.outputs.id }}
          PREVIEW_PROJECT: ${{ steps.preview.outputs.project }}
          PREVIEW_ROUTER: ${{ steps.preview.outputs.router }}
          PREVIEW_HOST: ${{ steps.preview.outputs.host }}
          PREVIEW_ORIGIN: ${{ steps.preview.outputs.origin }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_PROXY_NETWORK: ${{ vars.PREVIEW_PROXY_NETWORK || 'angui-proxy' }}
          PREVIEW_RUNTIME_IMAGE: ${{ vars.PREVIEW_RUNTIME_IMAGE || 'angui-preview-runtime:bookworm' }}
          PREVIEW_DEMO_PASSWORD: ${{ steps.credentials.outputs.password }}
          AMAP_WEBSERVICE_KEY: ${{ secrets.AMAP_WEBSERVICE_KEY }}
          AMAP_JSAPI_SECURITY_CODE: ${{ secrets.AMAP_JSAPI_SECURITY_CODE }}
          ANGUI_AI_PROVIDERS_JSON: ${{ vars.ANGUI_AI_PROVIDERS_JSON }}
          ANGUI_PREVIEW_AI_ENDPOINT: ${{ secrets.ANGUI_PREVIEW_AI_ENDPOINT }}
          ANGUI_PREVIEW_AI_KEY: ${{ secrets.ANGUI_PREVIEW_AI_KEY }}
          PREVIEW_REPOSITORY_DIR: ${{ github.workspace }}
          PREVIEW_BACKEND_DIR: ${{ github.workspace }}/.preview/backend
          PREVIEW_FRONTEND_DIR: ${{ github.workspace }}/.preview/frontend
        run: |
          chmod +x deploy/preview/deploy-local.sh
          deploy/preview/deploy-local.sh deploy

      - name: Write temporary preview access
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.origin }}
          PREVIEW_PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          {
            echo "Preview deployed at ${PREVIEW_URL}"
            echo
            echo "Temporary password for family@demo.invalid, commander@demo.invalid, volunteer@demo.invalid, learner@demo.invalid, and admin@demo.invalid: \`${PREVIEW_PASSWORD}\`"
            echo
            echo "The next deployment resets this preview's SQLite database and invalidates these credentials."
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    if: >-
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      vars.PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: angui-preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Stop deleted branch preview
        shell: bash
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
          PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/var/github-runner/angui/previews' }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "${DELETED_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-48)"
          test -n "${slug}"
          export PREVIEW_ID="branch-${slug}"
          export PREVIEW_PROJECT="branch-${slug}"
          chmod +x deploy/preview/deploy-local.sh
          deploy/preview/deploy-local.sh cleanup
