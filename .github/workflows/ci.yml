name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  ARTIFACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  # A push and a pull_request event can name the same commit. Serializing by
  # the head SHA lets the second event observe the first successful full CI and
  # skip its expensive jobs instead of compiling and testing the same code.
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  deduplicate:
    name: Deduplicate commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether this SHA already passed CI
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                per_page: 100,
              },
            );
            const previousSuccess = runs.find(
              (run) => run.id !== context.runId && run.conclusion === 'success',
            );
            const shouldRun = previousSuccess === undefined;
            core.setOutput('should_run', String(shouldRun));
            if (!shouldRun) {
              core.notice(
                `Skipping duplicate CI for ${process.env.HEAD_SHA}; ` +
                `run ${previousSuccess.html_url} already succeeded.`,
              );
            }

  backend:
    name: Rust checks
    needs: deduplicate
    if: needs.deduplicate.outputs.should_run == 'true'
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Release build
        run: cargo build --workspace --all-features --release --locked

      - name: Upload backend binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-linux-${{ env.ARTIFACT_SHA }}
          path: |
            target/release/angui
            target/release/angui-admin
            target/release/migration
          if-no-files-found: error
          retention-days: 7

  database:
    name: PostgreSQL and MySQL migrations
    needs: deduplicate
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    # The first CI for a SHA must be equivalent to a PR CI. Otherwise a branch
    # could pass before its PR exists and later skip this migration coverage.
    if: needs.deduplicate.outputs.should_run == 'true'
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: angui
          POSTGRES_USER: angui
          POSTGRES_PASSWORD: angui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U angui -d angui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: angui
          MYSQL_USER: angui
          MYSQL_PASSWORD: angui
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Exercise PostgreSQL migrations
        env:
          DATABASE_URL: postgres://angui:angui@127.0.0.1:5432/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

      - name: Exercise MySQL migrations
        env:
          DATABASE_URL: mysql://angui:angui@127.0.0.1:3306/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

  frontend:
    name: Frontend checks
    needs: deduplicate
    if: needs.deduplicate.outputs.should_run == 'true'
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          # Self-hosted runners share github-action's persistent Yarn cache.
          # Avoid restoring or saving the same cache through the remote Actions
          # Cache service, which adds a slow network dependency to every CI run.
          package-manager-cache: false
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Build
        working-directory: frontend
        env:
          VITE_AMAP_JS_API_KEY: ${{ secrets.AMAP_JS_API_KEY }}
        run: yarn build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-frontend-${{ env.ARTIFACT_SHA }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
