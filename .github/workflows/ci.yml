name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  ARTIFACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  # A push and a pull_request event can name the same commit. Serializing by
  # the head SHA lets the second event observe the first successful full CI and
  # skip its expensive jobs instead of compiling and testing the same code.
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  deduplicate:
    name: Deduplicate commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether this SHA already passed CI
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                per_page: 100,
              },
            );
            // Push runs are the artifact-producing source for preview
            // deployments. They must execute even when the same SHA already
            // passed through pull_request CI; otherwise workflow_run preview
            // jobs receive a successful run with no artifacts to download.
            const previousSuccess = process.env.EVENT_NAME === 'pull_request'
              ? runs.find(
                  (run) => run.id !== context.runId && run.conclusion === 'success',
                )
              : undefined;
            const shouldRun = previousSuccess === undefined;
            core.setOutput('should_run', String(shouldRun));
            if (!shouldRun) {
              core.notice(
                `Skipping duplicate CI for ${process.env.HEAD_SHA}; ` +
                `run ${previousSuccess.html_url} already succeeded.`,
              );
            }

  backend:
    name: Rust checks
    needs: deduplicate
    if: needs.deduplicate.outputs.should_run == 'true'
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
          
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Release build
        run: cargo build --workspace --all-features --release --locked

      - name: Upload backend binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-linux-${{ env.ARTIFACT_SHA }}
          path: |
            target/release/angui
            target/release/angui-admin
            target/release/migration
          if-no-files-found: error
          retention-days: 7

  database:
    name: PostgreSQL and MySQL migrations
    needs: deduplicate
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    # The first CI for a SHA must be equivalent to a PR CI. Otherwise a branch
    # could pass before its PR exists and later skip this migration coverage.
    if: needs.deduplicate.outputs.should_run == 'true'
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      POSTGRES_CONTAINER: angui-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_CONTAINER: angui-mysql-${{ github.run_id }}-${{ github.run_attempt }}
      # Service containers always pull, even when an image is cached. Internal
      # runners use provisioned images so a registry outage cannot block CI;
      # GitHub-hosted external-fork jobs may pull a missing image normally.
      DATABASE_IMAGE_PULL_POLICY: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'missing' || 'never' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Start database containers
        run: |
          docker run --detach \
            --pull="$DATABASE_IMAGE_PULL_POLICY" \
            --name "$POSTGRES_CONTAINER" \
            --publish 5432:5432 \
            --env POSTGRES_DB=angui \
            --env POSTGRES_USER=angui \
            --env POSTGRES_PASSWORD=angui \
            --health-cmd "pg_isready -U angui -d angui" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:17-alpine

          docker run --detach \
            --pull="$DATABASE_IMAGE_PULL_POLICY" \
            --name "$MYSQL_CONTAINER" \
            --publish 3306:3306 \
            --env MYSQL_DATABASE=angui \
            --env MYSQL_USER=angui \
            --env MYSQL_PASSWORD=angui \
            --env MYSQL_ROOT_PASSWORD=root \
            --health-cmd "mysqladmin ping --silent" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            mysql:8.4

          wait_for_healthy() {
            container="$1"
            max_attempts="$2"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                return 0
              fi
              if [ -z "$status" ] || [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 2
              attempt=$((attempt + 1))
            done
            docker logs "$container" || true
            return 1
          }

          wait_for_healthy "$POSTGRES_CONTAINER" 30
          wait_for_healthy "$MYSQL_CONTAINER" 45

      - name: Exercise PostgreSQL migrations
        env:
          DATABASE_URL: postgres://angui:angui@127.0.0.1:5432/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

      - name: Exercise MySQL migrations
        env:
          DATABASE_URL: mysql://angui:angui@127.0.0.1:3306/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

      - name: Stop database containers
        if: always()
        run: docker rm --force "$POSTGRES_CONTAINER" "$MYSQL_CONTAINER" 2>/dev/null || true

  frontend:
    name: Frontend checks
    needs: deduplicate
    if: needs.deduplicate.outputs.should_run == 'true'
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          # Self-hosted runners share github-action's persistent Yarn cache.
          # Avoid restoring or saving the same cache through the remote Actions
          # Cache service, which adds a slow network dependency to every CI run.
          package-manager-cache: false
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Build
        working-directory: frontend
        env:
          VITE_AMAP_JS_API_KEY: ${{ secrets.AMAP_JS_API_KEY }}
        run: yarn build

      - name: Test
        working-directory: frontend
        run: yarn test

      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-frontend-${{ env.ARTIFACT_SHA }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser end-to-end tests
    needs: deduplicate
    if: needs.deduplicate.outputs.should_run == 'true'
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # The self-hosted runner image provides Chromium's Linux libraries.
      # Do not use --with-deps here: it invokes apt through sudo.
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: yarn playwright install chromium

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: yarn test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ env.ARTIFACT_SHA }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
