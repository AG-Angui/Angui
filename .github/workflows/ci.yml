name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust checks
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Release build
        run: cargo build --workspace --all-features --release --locked

      - name: Upload backend binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-linux-${{ github.sha }}
          path: |
            target/release/angui
            target/release/angui-admin
            target/release/migration
          if-no-files-found: error
          retention-days: 7

  database:
    name: PostgreSQL and MySQL migrations
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 30
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: angui
          POSTGRES_USER: angui
          POSTGRES_PASSWORD: angui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U angui -d angui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: angui
          MYSQL_USER: angui
          MYSQL_PASSWORD: angui
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: database-ci
          cache-on-failure: true

      - name: Exercise PostgreSQL migrations
        env:
          DATABASE_URL: postgres://angui:angui@127.0.0.1:5432/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

      - name: Exercise MySQL migrations
        env:
          DATABASE_URL: mysql://angui:angui@127.0.0.1:3306/angui
        run: |
          cargo run --locked -p migration -- up
          cargo run --locked -p migration -- status
          cargo run --locked -p migration -- refresh
          cargo run --locked -p migration -- status

  frontend:
    name: Frontend checks
    # External forks never execute on the server that holds deployment access.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'angui-ci' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmmirror.com
          mirror: https://npmmirror.com/mirrors/node

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint:frontend

      - name: Build
        run: npm run build:frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: angui-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
