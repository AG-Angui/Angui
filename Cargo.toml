[package]
name = "angui"
version = "0.1.0"
edition = "2024"
description = "Angui search-and-rescue collaboration API"
license = "UNLICENSED"

[workspace]
members = ["migration"]
resolver = "2"

[dependencies]
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
# Keep HTTP/2 disabled until Actix HTTP moves to a fixed h2 release.
actix-web = { version = "4.14.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
argon2 = "0.5.3"
chrono = "0.4.42"
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.12.1"
http = "0.2.12"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
libheif-rs = { version = "2.7.0", default-features = false, features = ["v1_19", "embedded-libheif"], optional = true }
lettre = { version = "0.11.15", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname", "pool"] }
log = "0.4.29"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[features]
default = []
heic = ["dep:libheif-rs"]

[dev-dependencies]
migration = { path = "migration" }
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2026.05.25"
dependencies = ["libheif[hevc,aom,x264,h264-decoder,jpeg]"]
