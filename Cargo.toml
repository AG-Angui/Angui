[package]
name = "angui"
version = "0.1.0"
edition = "2024"
description = "Angui search-and-rescue collaboration API"
license = "UNLICENSED"

[workspace]
members = ["migration"]
resolver = "2"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.14.0"
chrono = "0.4.42"
env_logger = "0.11.11"
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[dev-dependencies]
migration = { path = "migration" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
