      description: Returns only effective training or public-information resources whose visibility matches the authenticated account and whose immutable governance chain records independent de-identification, review, and publication. Withdrawn, future, internal-case, and raw archive material are never returned.
      security: [{ bearerAuth: [] }]
      x-account-types: [member, learner]
      x-data-classification: public-or-training
      parameters:
