          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ClueStatus" }
        - name: source_type
          in: query
          description: Filter by the recorded clue origin without broadening the caller's role-scoped visibility.
          schema: { $ref: "#/components/schemas/ClueSourceType" }
        - name: q
          in: query
          description: Case-insensitive keyword match against already role-visible clue content, source, source type, status, location, and timestamps.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, occurred_at], default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
