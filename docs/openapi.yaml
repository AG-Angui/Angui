        confirmed and belong to the same case. When volunteer recipients are supplied, each must
        be an active case member with the volunteer role and the task is initially `assigned`.
        When recipients are omitted, the task is an open `pending_claim` task that case volunteers
        can apply to join. Creation, assignments, and audit events commit in one transaction. No
        automatic assignment or high-risk-action authorization is performed.
