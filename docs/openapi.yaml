openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Angui API
  version: 0.1.0
  summary: Angui 搜救协作服务的认证、案件成员、案件和线索 API
  description: |
    本文档描述当前 Rust/Actix Web 服务实际注册的 HTTP API。

    除健康检查和登录外，所有接口都要求使用服务端会话 Bearer token。
    案件访问还取决于当前用户是否属于目标案件以及其案件角色。

    重要授权规则：

    - `member` 可以创建案件；创建者会成为该案件的 `family` 成员。
    - `commander` 与 `volunteer` 是可叠加的全局能力，不会自动产生案件成员关系。
    - family 只能显式邀请持有 commander 能力的活动成员；commander 可以添加 family、commander 或 volunteer，但同名案件角色要求目标成员持有相应全局能力。
    - commander 可以查看和审核案件内全部线索，并改变案件状态。
    - family 可以查看已确认线索及本人提交的线索。
    - volunteer 只能查看已确认线索，且 elder_profile.health_notes 会由服务端返回为 null。
    - 没有案件成员关系时，案件资源通常返回 404，以减少资源 ID 枚举。

    阅读约定：

    - 每个 operation 的 security 明确标出是否需要 Bearer 会话；没有 security 的公共接口会显式使用空数组。
    - x-account-types 表示可调用该 operation 的长期账号类型；x-case-roles 表示还必须具备的案件成员角色。全局能力仅用于成员分配资格，不能自动授予案件访问权。
    - x-data-classification 标出响应中需要按案件成员关系和角色裁剪的数据。客户端不得把 case-restricted 或 sensitive 字段缓存到公共页面、日志或分析服务。

    当前仍是 MVP API，不应处理真实搜救数据。正式部署必须使用 HTTPS。
  contact:
    name: AG-Angui
    url: https://github.com/AG-Angui/Angui
servers:
  - url: http://127.0.0.1:8080
    description: 本地 Actix Web 开发服务器
tags:
  - name: Health
    description: 服务健康检查
  - name: Authentication
    description: 服务端会话登录、查询和撤销
  - name: Access requests
    description: 账号访问申请、邮箱验证、管理员审核和密码设置
  - name: Cases
    description: 案件、老人资料、案件成员和案件内线索；必须先通过案件成员关系授权
  - name: Clues
    description: 线索人工审核
  - name: Tasks
    description: Case-internal rescue task creation, assignment, and execution status.
  - name: Intake sessions
    description: 家属创建的未确认走失信息问询会话
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 获取服务健康状态
      description: 不访问认证会话，可用于进程和反向代理健康检查。
      security: []
      x-account-types: []
      x-data-classification: public
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: angui-api
                version: 0.1.0

  /api/ai/executions/{execution_id}:
    parameters:
      - name: execution_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Intake sessions]
      operationId: getAiExecution
      summary: Read a caller-owned controlled AI execution status
      description: Returns safe lifecycle metadata only, never prompts, provider streams, candidate text, or sensitive inputs.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200": { description: Safe execution state, content: { application/json: { schema: { $ref: "#/components/schemas/AiExecution" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/ai/executions/{execution_id}/events:
    parameters:
      - name: execution_id
        in: path
        required: true
        schema: { type: string }
      - name: after
        in: query
        required: false
        schema: { type: integer, minimum: 0 }
    get:
      tags: [Intake sessions]
      operationId: listAiExecutionEvents
      summary: Read ordered safe execution events after an event id
      description: Reconnect with `after` to obtain only newer, de-duplicable lifecycle events, then fetch the existing draft resource after completion.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200": { description: Ordered safe SSE events, content: { text/event-stream: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 使用邮箱和密码创建会话
      description: |
        登录成功后返回一次原始 Bearer token。数据库只保存 token 的 SHA-256 哈希。
        登录失败会同时按客户端 IP 和客户端 IP + 规范化邮箱执行进程内限流。
      security: []
      x-account-types: []
      x-data-classification: account-private
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: family@demo.invalid
              password: provided-out-of-band
      responses:
        "200":
          description: 登录成功并创建服务端会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: 获取当前认证用户
      security:
        - bearerAuth: []
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "200":
          description: 当前活动账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 撤销当前服务端会话
      description: 成功后，当前 Bearer token 立即失效。
      security:
        - bearerAuth: []
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "204":
          description: 会话已撤销，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/access-requests:
    post:
      tags: [Access requests]
      operationId: createAccessRequest
      summary: 提交账号访问申请
      description: 无需认证。服务端对邮箱地址返回一致的受理消息，并发送有效期为 24 小时的邮箱验证链接；原始验证令牌只会出现在邮件中，数据库只保存其哈希值。
      security: []
      x-account-types: []
      x-data-classification: account-private
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccessRequest" }
      responses:
        "200": { description: 申请已受理，等待邮箱验证, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestReceipt" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/access-requests/verify:
    post:
      tags: [Access requests]
      operationId: verifyAccessRequest
      summary: 验证账号访问申请邮箱
      description: 无需认证。验证令牌仅可使用一次，且在签发 24 小时后失效；验证成功后，申请进入管理员人工审核队列。
      security: []
      x-account-types: []
      x-data-classification: account-private
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyAccessRequest" }
      responses:
        "200": { description: 邮箱已验证，申请等待人工审核, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestReceipt" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/password-setup:
    post:
      tags: [Access requests]
      operationId: setPassword
      summary: 使用审核通过后的链接设置密码
      description: 无需认证。仅接受管理员批准后签发的一次性密码设置令牌；密码长度必须为 12 至 256 个字符。成功后账户激活，令牌立即失效。
      security: []
      x-account-types: []
      x-data-classification: account-private
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSetupRequest" }
      responses:
        "204": { description: 密码已设置，账户已激活 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/users/me/profile:
    get:
      tags: [Authentication]
      operationId: getMyProfile
      summary: Get the current account profile
      security: [{ bearerAuth: [] }]
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "200": { description: Current account profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Authentication]
      operationId: updateMyProfile
      summary: Update permitted current account profile fields
      description: Roles, global capabilities, account status, and case roles are rejected. Audit metadata contains field names only.
      security: [{ bearerAuth: [] }]
      x-account-types: [member, learner]
      x-data-classification: account-private
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserProfileRequest" } } }
      responses:
        "200": { description: Updated current account profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/intake-sessions:
    post:
      tags: [Intake sessions]
      operationId: createIntakeSession
      summary: Create a member intake session
      description: |
        Only member accounts can create an unconfirmed intake draft. Unknown fields, including
        confirmed, are rejected. This endpoint always returns rule-based guidance and writes no
        raw answer content to audit metadata. Per-question business limits and question order come
        from the active database configuration; the server also enforces an independent hard cap.
      x-account-types: [member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntakeSessionRequest"
            example:
              initial_answers:
                basic_information: Fictional elder profile
                last_seen: Fictional community gate; time needs verification
      responses:
        "201":
          description: Intake session created with the next rule-based question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/answers:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    post:
      tags: [Intake sessions]
      operationId: submitIntakeSessionAnswer
      summary: Submit one intake answer and receive the next rule-based question
      description: |
        Only the session creator can append a field that has not already been answered. Send
        `replace: true` to correct a previously submitted field; the server retains a revision
        record and replaces the current unconfirmed draft answer. The raw free-text answer is
        stored separately from its unconfirmed draft candidate field. Optional `structured`
        facts are merged into the session's structured draft and produce rule assessments; an
        assessment can block confirmation but does not turn any draft value into a formal fact.
        This endpoint does not call an AI provider, so model and template_version are null; text
        that resembles an instruction is treated only as an unconfirmed answer. Closed or
        confirmed sessions and duplicate field submissions without `replace` return 409. Raw
        answer content is never copied into audit metadata.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitIntakeAnswerRequest"
            example:
              field: health_status
              answer: Fictional mobility note; verification is still required.
      responses:
        "201":
          description: Draft candidate field stored and next rule-based question returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitIntakeAnswerResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/photos:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    get:
      tags: [Intake sessions]
      operationId: listIntakeSessionPhotos
      summary: List controlled missing-person photo metadata
      description: Only the session creator can list pre-confirmation photos. The response never exposes a storage key or public URL.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200": { description: Owner-scoped photo metadata, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IntakePhoto" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Intake sessions]
      operationId: uploadIntakeSessionPhoto
      summary: Upload a controlled missing-person portrait
      description: Only the session creator can upload one JPEG, PNG, HEIC, or HEIF image. The server validates actual bytes (client MIME may be empty or a mobile compatibility value), applies resource limits, decodes HEIC/HEIF when enabled, and re-encodes only JPEG/PNG with non-essential metadata removed. It does not process EXIF location or run face recognition, and never creates a public URL.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, HEIC, or HEIF image. The declared MIME is advisory; the server validates actual file content.
      responses:
        "201": { description: Controlled photo metadata, content: { application/json: { schema: { $ref: "#/components/schemas/IntakePhoto" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/intake-sessions/{session_id}/photos/{photo_id}:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
      - name: photo_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Intake sessions]
      operationId: downloadIntakeSessionPhoto
      summary: Download an owner-scoped pre-confirmation photo
      description: Only the session creator can retrieve the image. The response is private and no-store; it is not a public media URL.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200": { description: JPEG or PNG image, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/intake-sessions/{session_id}/profile-draft:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    get:
      tags: [Intake sessions]
      operationId: getIntakeSessionProfileDraft
      summary: Get the latest profile draft version for an intake session
      description: Only the session creator can read this sensitive version. It is assembled only from that session's family-provided answers and never becomes a formal case fact merely because the version is reviewed. Each non-empty display field has field-level provenance and a generation time; status and requires_human_confirmation report the persisted version-review state.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200":
          description: Unconfirmed profile draft requiring human confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeProfileDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/profile-draft/{draft_id}/review:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Intake sessions]
      operationId: reviewIntakeProfileDraft
      summary: Confirm or reject one generated profile draft version
      description: Only the session creator can review a persisted draft version. A successful confirmation returns status confirmed and requires_human_confirmation false; rejection returns status superseded. The reviewed version remains separate from the final case-creation confirmation.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewIntakeProfileDraftRequest" }
      responses:
        "200": { description: Reviewed profile draft version, content: { application/json: { schema: { $ref: "#/components/schemas/IntakeProfileDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/intake-sessions/{session_id}/ai-follow-up:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    get:
      tags: [Intake sessions]
      operationId: getIntakeAiFollowUp
      summary: 获取一条 AI 引导的下一项问询
      description: 仅会话创建者可请求。服务端始终先确定当前阶段的下一题，AI 只能改写该题的提问方式，不能改变字段、必填性或阶段顺序；不可用、超时、策略拒绝或输出无效时返回同一题目的确定性静态版本。响应仅作问询引导，不会创建、确认、发布或修改任何问询数据。
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200":
          description: AI 引导的下一题、确定性降级题，或当前没有下一题时的空结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeAiFollowUpResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/intake-sessions/{session_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    post:
      tags: [Intake sessions]
      operationId: confirmIntakeSession
      summary: Second human confirmation creates the formal case
      description: This endpoint is available only after the session creator has started the family-visible initial review and acknowledged every displayed non-blocking item. The submitted profile must exactly match the reviewed snapshot. AI output remains an unconfirmed draft; it cannot create, publish, dispatch, or confirm anything. Creation of the case, elder profile, family membership, `case.created` audit event, and session link is one transaction. A successful repeat is idempotent and returns the linked case's current status.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmIntakeSessionRequest"
      responses:
        "201":
          description: Formal case created, or the linked case returned from an idempotent confirmation retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmIntakeSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/ai-initial-review:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    get:
      tags: [Intake sessions]
      operationId: getIntakeAiInitialReview
      summary: Get the family-only initial-review draft
      description: Only the session creator can read this sensitive review. It contains reviewable uncertainty prompts, never confirmed facts or location conclusions.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200": { description: Current initial-review draft, content: { application/json: { schema: { $ref: "#/components/schemas/IntakeAiInitialReviewResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Intake sessions]
      operationId: startIntakeAiInitialReview
      summary: Start the family-visible AI initial review
      description: The session creator submits the profile snapshot after first confirmation. The service validates model JSON and policy boundaries; the Gateway performs at most two total HTTP calls (one JSON repair or one compliant provider failover, never both), while unavailable providers, invalid output, and execution failures return a rule-based review fallback. This operation never creates a case. The response is SSE: optional safe `progress` events contain only a stage (`queued`, `preparing`, `generating`, `validating`, or `fallback`), and the final `completed` event contains the review result. Partial streams are not a valid review result.
