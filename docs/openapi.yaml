        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 会被去除首尾空白并转换为小写；当前服务端仅检查非空、长度和包含 @。
          example: family@demo.invalid
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: 登录密码。失败响应不会区分邮箱、账号状态或密码错误。

    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          pattern: "^angui_[0-9a-f]{64}$"
          description: 只在登录响应中返回一次的原始会话令牌。
          example: angui_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        expires_at:
          type: string
          format: date-time
          description: 服务端会话过期时间。
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, account_type, global_capabilities]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 320
        display_name:
          type: string
        account_type:
          $ref: "#/components/schemas/AccountType"
        global_capabilities:
          type: array
          items:
            $ref: "#/components/schemas/GlobalCapability"

    UserPreferences:
      type: object
      additionalProperties: false
      required: [locale, reduced_motion]
      properties:
        locale: { type: string, enum: [zh-CN, en-US] }
