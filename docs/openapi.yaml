components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Angui session token
      description: 登录接口返回的 angui_ 前缀服务端会话令牌。

  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      description: 案件 UUID。没有案件成员关系时通常按未找到处理。
      schema:
        type: string
        format: uuid
    ClueId:
      name: clue_id
      in: path
      required: true
      description: 线索 UUID。
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      description: Case task UUID. Non-members and non-assigned volunteers receive not found.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once per logical write. Retrying with the same key and payload returns the first receipt without repeating writes or audit events; reusing a key with a different payload returns 409.
      schema:
        type: string
        format: uuid
    IntakeSessionId:
      name: session_id
      in: path
      required: true
      description: 问询会话 UUID。非创建者按未找到处理，避免确认会话存在。
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: 请求字段、枚举值或业务输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_error
              message: last_seen_location is required
    Unauthorized:
      description: 缺少会话、Authorization 头无效、会话已过期或已撤销
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: invalid or expired session
    Forbidden:
      description: 用户已认证，但账号角色或案件角色不允许该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: this account cannot perform the requested case action
    NotFound:
      description: 资源不存在，或当前用户没有相应案件成员关系
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: case was not found
    Conflict:
      description: 资源当前状态与请求冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: new clues can only be added to active cases
    RateLimited:
      description: 当前进程记录的登录失败次数已超过限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: rate_limited
              message: too many failed login attempts; try again later
    InternalError:
      description: 内部服务或数据库操作失败；不会返回内部 SQL
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: internal service error
            database:
              value:
                error:
                  code: database_error
                  message: database operation failed

  schemas:
    CreateAccessRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, requested_role]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          format: email
          description: 申请人的邮箱地址；服务端会去除首尾空白并转换为小写。
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: 申请人的显示名称。
        requested_role:
          type: string
          enum: [family, volunteer, commander]
          description: 申请的业务角色；不支持通过申请授予管理员能力。

    VerifyAccessRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: 邮件中的一次性邮箱验证令牌。

    PasswordSetupRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          description: 管理员批准后邮件中的一次性密码设置令牌。
        password:
          type: string
          minLength: 12
          maxLength: 256
          format: password
          description: 新密码；服务端仅校验长度，不会在响应或审计元数据中返回该值。

    AccessRequestReceipt:
      type: object
      additionalProperties: false
      required: [id, status, message]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_verification, pending_review]
        message:
          type: string
          description: 面向申请人的中文状态提示；不用于判定邮箱或账号是否存在。

    ReviewAccessRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        role:
          type: string
          enum: [family, volunteer, commander]
          description: 批准时可替代申请角色；省略时使用申请的角色。
        reason:
          type: [string, "null"]
          minLength: 1
          description: 拒绝时必填的人工审核理由；批准时可选。

    AdminAccessRequest:
      type: object
      additionalProperties: false
      required: [id, email, display_name, requested_role, status, email_verified_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        requested_role: { type: string, enum: [family, volunteer, commander] }
        status:
          type: string
          enum: [pending_verification, pending_review, approved, rejected]
        email_verified_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    LearningResource:
      type: object
      additionalProperties: false
