        name: { type: string, minLength: 1, maxLength: 120 }
        place_type: { type: string, description: Value must appear in the current case resource configuration. }
        address: { type: string, minLength: 1, maxLength: 500 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        visibility: { type: string, enum: [public, confirmed, internal] }

    ReviewCasePlaceRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [confirmed, rejected] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    CaseMapView:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaseMapItem" }

    CaseMapItem:
      type: object
      additionalProperties: false
      required: [id, object_type, display_name, longitude, latitude, location_text, location_precision, source, occurred_at, reported_at, review_status, related_task_id, updated_at]
      properties:
        id: { type: string }
        object_type: { type: string, enum: [last_seen, place, clue, task] }
        display_name:
          type: [string, "null"]
          description: 对象自身名称；last_seen 为 null，客户端必须依据 object_type 本地化展示标签。
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        location_text: { type: [string, "null"] }
        location_precision: { type: string, enum: [exact, unknown, approximate] }
        source: { type: string }
        occurred_at: { type: [string, "null"], format: date-time }
        reported_at: { type: [string, "null"], format: date-time }
        review_status: { type: string }
        related_task_id: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }

    CasePublicProgressItem:
      type: object
      additionalProperties: false
      required: [clue_id, progress_type, review_status, updated_at]
      properties:
        clue_id: { type: string, format: uuid }
        progress_type:
          type: string
          enum: [confirmed_update, family_follow_up]
          description: Public-safe category generated by the server. Raw clue text is never returned.
        review_status: { type: string, enum: [pending_review, needs_verification, confirmed] }
        updated_at: { type: string, format: date-time }

    CasePublicProgress:
      type: object
      additionalProperties: false
      required: [case_id, status, publication_status, generated_at, confirmed_progress, requested_family_information, safety_and_contact_reminders]
      properties:
        case_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CaseStatus" }
        publication_status: { type: string, enum: [reviewed_public], description: Server-controlled family-safe publication state. }
        generated_at: { type: string, format: date-time }
        confirmed_progress: { type: array, items: { $ref: "#/components/schemas/CasePublicProgressItem" } }
        requested_family_information: { type: array, items: { $ref: "#/components/schemas/CasePublicProgressItem" } }
        safety_and_contact_reminders: { type: array, items: { type: string } }

    CreateClueDraftRequest:
      type: object
      additionalProperties: false
      required: [source_record_id]
      properties:
        source_record_id: { type: string, format: uuid, description: Server-owned case source record. }

    ClueDraft:
      type: object
      additionalProperties: false
      required: [id, case_id, status, content, source_type, uncertainty_notice, template_version, provider_model, degradation_status, candidate, review_status, version]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review] }
        content: { type: string }
        candidate: { $ref: "#/components/schemas/ClueDraftCandidate" }
        review_status: { type: string, enum: [pending_review, accepted, rejected] }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_reason: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
        source_type: { type: string, enum: [manual_report, field_report] }
        raw_record_reference: { type: [string, "null"] }
        occurred_at: { type: [string, "null"], format: date-time }
        location_text: { type: [string, "null"] }
        uncertainty_notice: { type: string }
        template_version: { type: string }
        provider_model: { type: [string, "null"] }
        degradation_status: { type: string, enum: [manual_review_required, rule_based_fallback] }

    ClueDraftCandidate:
      type: object
      additionalProperties: false
      description: >-
        A non-factual field proposal produced from a controlled source record. Null or
        empty candidate values mean that a person must supply or verify the field;
        they must not be inferred by a client.
      required: [content_summary, occurred_at, location_text, source_text, action_candidates, missing_fields, source_excerpt]
      properties:
        content_summary:
          type: [string, "null"]
          maxLength: 1000
          description: Short draft summary only; it is not a confirmed statement.
        occurred_at:
          type: [string, "null"]
          maxLength: 80
          description: Candidate time as supplied or extracted; null means human completion is required.
        location_text:
          type: [string, "null"]
          maxLength: 500
          description: Candidate textual location only; the API does not make a location conclusion.
        source_text:
          type: [string, "null"]
          maxLength: 300
          description: Candidate source attribution; null means human verification is required.
        action_candidates:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 300 }
          description: Proposed follow-up actions, requiring human review before use.
        missing_fields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [occurred_at, location_text, source_text, action_candidates] }
          description: Fields still requiring human completion or verification.
        source_excerpt:
          type: string
          maxLength: 500
          description: Server-derived excerpt of the original controlled text. During review, any submitted value is ignored and recomputed by the server.

    ReviewClueDraftRequest:
      type: object
      additionalProperties: false
      required: [action, reason, candidate]
      properties:
        action:
          type: string
          enum: [accept, reject]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Mandatory human review rationale retained in the audit trail.
        candidate:
          allOf: [{ $ref: "#/components/schemas/ClueDraftCandidate" }]
          description: >-
            Human-corrected candidate. The service normalizes missing_fields and
            derives source_excerpt from the persisted controlled text.

    CasePoi:
      type: object
      additionalProperties: false
      required: [id, name, category, address, longitude, latitude, distance_meters, selection_token]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [hospital, police, transit, market, community_service] }
        address: { type: [string, "null"] }
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        distance_meters: { type: [integer, "null"], minimum: 0 }
        selection_token: { type: [string, "null"], maxLength: 2048 }

    CasePois:
      type: object
      additionalProperties: false
      required: [items, center_source, source, degradation_status, fallback_message]
      properties:
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CasePoi" } }
        center_source: { type: string, enum: [authorized_case_location, browser_location] }
        source: { type: string, enum: [amap_webservice, fixed_demo_fallback] }
        degradation_status: { type: string, enum: [available, degraded] }
        fallback_message: { type: [string, "null"] }

    CasePoiRoute:
      type: object
      additionalProperties: false
      required: [straight_line_meters, walking_distance_meters, walking_duration_seconds, source, degradation_status]
      properties:
        straight_line_meters: { type: integer, minimum: 0 }
        walking_distance_meters: { type: [integer, "null"], minimum: 0 }
        walking_duration_seconds: { type: [integer, "null"], minimum: 0 }
        source: { type: string, enum: [amap_webservice, straight_line_fallback] }
        degradation_status: { type: string, enum: [available, degraded] }

    CreateSummaryDraftRequest:
      type: object
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 12000, description: Optional commander edit that creates a new pending-review internal version; it cannot publish without the separate human review action. }

    ReviewSummaryDraftRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { type: string, enum: [submit, publish, reject, withdraw] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    SummaryDraft:
      type: object
      additionalProperties: false
      required: [id, case_id, status, content, source_scope, template_version, provider_model, generated_at, reviewed_at, review_reason, created_at, updated_at, publication_eligible]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review, published, rejected, withdrawn, superseded] }
        content: { type: string }
        source_scope: { type: array, items: { type: string } }
        template_version: { type: string }
        provider_model: { type: [string, "null"] }
        generated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        publication_eligible: { type: boolean }

    ArchiveDraft:
      type: object
      additionalProperties: false
      required: [id, case_id, status, content, source_scope, deidentification_status, template_version, provider_model, version, usage_scope, retention_status, deidentified_at, reviewed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review, published, rejected, withdrawn] }
        content: { type: string, description: Initial drafts contain no raw case materials. After an administrator confirms de-identification, a reviewed, de-identified organization draft may replace it. }
        source_scope: { type: array, items: { type: string, enum: [confirmed_clue_review_material, completed_task_review_material] } }
        deidentification_status: { type: string, enum: [manual_review_required, deidentified, rejected] }
        template_version: { type: string }
        provider_model: { type: [string, "null"], description: Null before administrator-confirmed de-identification; otherwise the audited model identifier for a reviewed organization draft. }
        version: { type: integer, minimum: 1 }
        usage_scope: { type: string, enum: [internal_archive, learning_resource] }
        retention_status: { type: string, enum: [retained, withdrawn] }
        deidentified_at: { type: [string, "null"], format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ArchiveReviewMaterial:
      type: object
      additionalProperties: false
      required: [id, case_id, version, parent_material_id, content, source_scope, status, created_by_user_id, reviewed_by_user_id, reviewed_at, review_reason, created_at, selected_for_ai]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        parent_material_id: { type: [string, "null"], format: uuid }
        content: { type: string, description: Administrator-visible de-identified review material or the initial controlled material awaiting de-identification. }
        source_scope: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, deidentified, rejected] }
        created_by_user_id: { type: string, format: uuid }
        reviewed_by_user_id: { type: [string, "null"], format: uuid }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_reason: { type: [string, "null"], description: Review reason is returned only within the administrator boundary. }
        created_at: { type: string, format: date-time }
        selected_for_ai: { type: boolean }

    ArchiveReviewMaterialDiff:
      type: object
      additionalProperties: false
      required: [from_version, to_version, added, removed]
      properties:
        from_version: { type: integer, minimum: 1 }
        to_version: { type: integer, minimum: 1 }
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }

    RestoreArchiveReviewMaterialRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    DeidentifyArchiveDraftRequest:
      type: object
      additionalProperties: false
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [confirm, reject] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        deidentified_material:
          type: [string, "null"]
          minLength: 1
          maxLength: 12000
          description: Required when outcome is confirm. Human-supplied de-identified material; it is the only archive material eligible for AI organization.

    ReviewArchiveDraftRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { type: string, enum: [publish, reject, withdraw] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    UpdateAdminUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, disabled, locked] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, account_type, global_capabilities, status, created_at, last_session_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        account_type: { $ref: "#/components/schemas/AccountType" }
        global_capabilities: { type: array, items: { $ref: "#/components/schemas/GlobalCapability" } }
        status: { type: string, enum: [active, disabled, locked] }
        created_at: { type: string, format: date-time }
        last_session_at: { type: [string, "null"], format: date-time }

    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [id, case_id, actor_user_id, action, entity_type, entity_id, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: [string, "null"], format: uuid }
        actor_user_id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        created_at: { type: string, format: date-time }

    AdminAuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminAuditEvent" } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    CaseSummary:
      type: object
      additionalProperties: false
      required: [case_id, access_role, generated_at, source_scope, last_confirmed_information, confirmed_clues, pending_verification, excluded_directions, current_focus, task_status, safety_reminders]
      properties:
        case_id: { type: string, format: uuid }
        access_role: { $ref: "#/components/schemas/CaseRole" }
        generated_at: { type: string, format: date-time }
        source_scope:
          type: array
          description: Machine-readable list of the authorized data categories used for this role's summary.
          items: { type: string }
        last_confirmed_information:
          oneOf:
            - $ref: "#/components/schemas/CaseSummaryClue"
            - type: "null"
          description: Most recently reported confirmed clue; never an unreviewed profile assertion or clue.
        confirmed_clues:
          type: array
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        pending_verification:
          type: array
          description: Items remain unverified and must not be presented as confirmed facts.
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        excluded_directions:
          type: array
          description: Commander-only non-confirmed directions with an exclusion status.
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        current_focus:
          type: array
          description: Commander-only active search directions derived from unfinished tasks.
          items: { $ref: "#/components/schemas/CaseSummaryFocus" }
        task_status:
          type: array
          description: Commander receives all tasks; volunteer receives only their assigned tasks; family receives none.
          items: { $ref: "#/components/schemas/CaseSummaryTask" }
        safety_reminders:
          type: array
          items: { type: string }

    CaseSummaryClue:
      type: object
      additionalProperties: false
      required: [clue_id, content, status, occurred_at, reported_at]
      properties:
        clue_id: { type: string, format: uuid }
        content: { type: string }
        status: { type: string }
        occurred_at: { type: [string, "null"], format: date-time }
        reported_at: { type: string, format: date-time }

    CaseSummaryFocus:
      type: object
      additionalProperties: false
      required: [task_id, title, objective, area_text, status]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        area_text: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }

    CaseSummaryTask:
      type: object
      additionalProperties: false
      required: [task_id, title, objective, area_text, due_at, status, safety_briefing]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        area_text: { type: string }
        due_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/TaskStatus" }
        safety_briefing: { type: string }

    CasePlace:
      type: object
      additionalProperties: false
      required: [id, case_id, name, place_type, address, longitude, latitude, source, visibility, review_status, created_at, updated_at, is_own_submission]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        name: { type: string }
        place_type: { type: string }
        address: { type: string }
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        source: { type: string, enum: [family, commander, volunteer], description: Set by the server from the submitter's case role. }
        visibility: { type: string, enum: [public, confirmed, internal] }
        review_status: { type: string, enum: [pending_review, confirmed, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_own_submission: { type: boolean }

    CaseAttachment:
      type: object
      additionalProperties: false
      required: [id, case_id, original_filename, content_type, byte_size, source, review_status, created_at, updated_at, is_own_submission]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        original_filename: { type: string, maxLength: 104 }
        content_type: { type: string, enum: [image/jpeg, image/png] }
        byte_size: { type: integer, minimum: 1, description: 默认最大 5242880；实际值由 ANGUI_ATTACHMENT_MAX_IMAGE_BYTES 配置。 }
        source: { type: string, enum: [family, commander, volunteer] }
        review_status: { type: string, enum: [pending_review, confirmed, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_own_submission: { type: boolean }

    CaseResourceConfiguration:
      type: object
      additionalProperties: false
      required: [attachment_max_image_bytes, attachment_max_per_case, case_place_types]
      properties:
        attachment_max_image_bytes: { type: integer, minimum: 1024 }
        attachment_max_per_case: { type: integer, minimum: 1 }
        case_place_types:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - internal_error
            - database_error
        message:
          type: string
