  /api/cases/{case_id}/pois:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      tags: [Cases]
      operationId: listCasePois
      summary: Find bounded nearby resources from an authorized or explicitly consented center
      description: The caller can choose only an allow-listed category. With no browser coordinates, the server performs one bounded nearby search (3 km, one page, at most 10 items) around an authorized task coordinate or, when none exists, a case-confirmed place. Volunteers may use only the case-confirmed public or confirmed-visibility places they are authorized to view; internal places remain commander-only. Callers outside the case cannot use a place as a search center. A caller may explicitly provide both browser coordinates in WGS-84 for this request only. The server converts them to AMap coordinates before the upstream request and must not persist them. Each coordinate-bearing returned POI includes a short-lived, case- and user-bound selection token for route planning. AMap transport, quota, conversion, or business failures return an explicit error or a fixed non-coordinate fallback and never disclose the provider key or source coordinate.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [commander, volunteer]
      x-data-classification: sensitive
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [hospital, police, transit, market, community_service], default: hospital }
        - name: browser_longitude
          in: query
          description: Optional WGS-84 browser location. Must be supplied with browser_latitude and is never persisted.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: browser_latitude
          in: query
          description: Optional WGS-84 browser location. Must be supplied with browser_longitude and is never persisted.
          schema: { type: number, minimum: -90, maximum: 90 }
      responses:
        "200": { description: Nearby POIs or explicit degraded fallback, content: { application/json: { schema: { $ref: "#/components/schemas/CasePois" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

