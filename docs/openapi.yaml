      operationId: listTaskCollaborationLocations
      summary: Read current task collaborator locations
      description: Exact location reports are visible only to an assigned volunteer on this exact task and the case commander. Expired reports and reports from other tasks are excluded.
      security: [{ bearerAuth: [] }]
      x-data-classification: sensitive
      responses:
        "200": { description: Latest unexpired report for each collaborator, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaskCollaborationLocation" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{task_id}/location-reports:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: submitTaskLocationReport
      summary: Submit one simulated location point while executing a task
      description: |
        Only the active task's assigned volunteer may submit a point. The endpoint accepts only
        `simulated` source data, does not accept a device identifier, and is not a background or
        continuous tracking API. The report must be recent (no more than 15 minutes old and no
