openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Angui API
  version: 0.1.0
  summary: Angui 搜救协作服务的认证、案件成员、案件和线索 API
  description: |
    本文档描述当前 Rust/Actix Web 服务实际注册的 HTTP API。

    除健康检查和登录外，所有接口都要求使用服务端会话 Bearer token。
    案件访问还取决于当前用户是否属于目标案件以及其案件角色。

    重要授权规则：

    - `member` 可以创建案件；创建者会成为该案件的 `family` 成员。
    - `commander` 与 `volunteer` 是可叠加的全局能力，不会自动产生案件成员关系。
    - family 只能显式邀请持有 commander 能力的活动成员；commander 可以添加 family、commander 或 volunteer，但同名案件角色要求目标成员持有相应全局能力。
    - commander 可以查看和审核案件内全部线索，并改变案件状态。
    - family 可以查看已确认线索及本人提交的线索。
    - volunteer 只能查看已确认线索，且 elder_profile.health_notes 会由服务端返回为 null。
    - 没有案件成员关系时，案件资源通常返回 404，以减少资源 ID 枚举。

    阅读约定：

    - 每个 operation 的 security 明确标出是否需要 Bearer 会话；没有 security 的公共接口会显式使用空数组。
    - x-account-types 表示可调用该 operation 的长期账号类型；x-case-roles 表示还必须具备的案件成员角色。全局能力仅用于成员分配资格，不能自动授予案件访问权。
    - x-data-classification 标出响应中需要按案件成员关系和角色裁剪的数据。客户端不得把 case-restricted 或 sensitive 字段缓存到公共页面、日志或分析服务。

    当前仍是 MVP API，不应处理真实搜救数据。正式部署必须使用 HTTPS。
  contact:
    name: AG-Angui
    url: https://github.com/AG-Angui/Angui
servers:
  - url: http://127.0.0.1:8080
    description: 本地 Actix Web 开发服务器
tags:
  - name: Health
    description: 服务健康检查
  - name: Authentication
    description: 服务端会话登录、查询和撤销
  - name: Cases
    description: 案件、老人资料、案件成员和案件内线索；必须先通过案件成员关系授权
  - name: Clues
    description: 线索人工审核
  - name: Tasks
    description: Case-internal rescue task creation, assignment, and execution status.
  - name: Intake sessions
    description: 家属创建的未确认走失信息问询会话
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 获取服务健康状态
      description: 不访问认证会话，可用于进程和反向代理健康检查。
      security: []
      x-account-types: []
      x-data-classification: public
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: angui-api
                version: 0.1.0

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 使用邮箱和密码创建会话
      description: |
        登录成功后返回一次原始 Bearer token。数据库只保存 token 的 SHA-256 哈希。
        登录失败会同时按客户端 IP 和客户端 IP + 规范化邮箱执行进程内限流。
      security: []
      x-account-types: []
      x-data-classification: account-private
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: family@demo.invalid
              password: provided-out-of-band
      responses:
        "200":
          description: 登录成功并创建服务端会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: 获取当前认证用户
      security:
        - bearerAuth: []
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "200":
          description: 当前活动账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 撤销当前服务端会话
      description: 成功后，当前 Bearer token 立即失效。
      security:
        - bearerAuth: []
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "204":
          description: 会话已撤销，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/profile:
    get:
      tags: [Authentication]
      operationId: getMyProfile
      summary: Get the current account profile
      security: [{ bearerAuth: [] }]
      x-account-types: [member, learner]
      x-data-classification: account-private
      responses:
        "200": { description: Current account profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Authentication]
      operationId: updateMyProfile
      summary: Update permitted current account profile fields
      description: Roles, global capabilities, account status, and case roles are rejected. Audit metadata contains field names only.
      security: [{ bearerAuth: [] }]
      x-account-types: [member, learner]
      x-data-classification: account-private
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserProfileRequest" } } }
      responses:
        "200": { description: Updated current account profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/intake-sessions:
    post:
      tags: [Intake sessions]
      operationId: createIntakeSession
      summary: Create a member intake session
      description: |
        Only member accounts can create an unconfirmed intake draft. Unknown fields, including
        confirmed, are rejected. This endpoint always returns rule-based guidance and writes no
        raw answer content to audit metadata. Per-question business limits and question order come
        from the active database configuration; the server also enforces an independent hard cap.
      x-account-types: [member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntakeSessionRequest"
            example:
              initial_answers:
                basic_information: Fictional elder profile
                last_seen: Fictional community gate; time needs verification
      responses:
        "201":
          description: Intake session created with the next rule-based question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/answers:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    post:
      tags: [Intake sessions]
      operationId: submitIntakeSessionAnswer
      summary: Submit one intake answer and receive the next rule-based question
      description: |
        Only the session creator can append a field that has not already been answered. Send
        `replace: true` to correct a previously submitted field; the server retains a revision
        record and replaces the current unconfirmed draft answer. The raw free-text answer is
        stored separately from its unconfirmed draft candidate field. Optional `structured`
        facts are merged into the session's structured draft and produce rule assessments; an
        assessment can block confirmation but does not turn any draft value into a formal fact.
        This endpoint does not call an AI provider, so model and template_version are null; text
        that resembles an instruction is treated only as an unconfirmed answer. Closed or
        confirmed sessions and duplicate field submissions without `replace` return 409. Raw
        answer content is never copied into audit metadata.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitIntakeAnswerRequest"
            example:
              field: health_status
              answer: Fictional mobility note; verification is still required.
      responses:
        "201":
          description: Draft candidate field stored and next rule-based question returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitIntakeAnswerResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/profile-draft:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    get:
      tags: [Intake sessions]
      operationId: getIntakeSessionProfileDraft
      summary: Get the unconfirmed profile draft for an intake session
      description: Only the session creator can read this sensitive draft. It is assembled only from that session's family-provided answers, is explicitly marked `draft`, and is never a formal case fact. Each non-empty display field has field-level provenance and a generation time so it can be reviewed before confirmation.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      responses:
        "200":
          description: Unconfirmed profile draft requiring human confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeProfileDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/intake-sessions/{session_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/IntakeSessionId"
    post:
      tags: [Intake sessions]
      operationId: confirmIntakeSession
      summary: Human-confirm a profile and create the formal case
      description: The session creator submits family-reviewed final values. Only display_name and last_seen_location are required by the current service; all other profile fields are optional overrides. Creation of the case, elder profile, family membership, `case.created` audit event, and session link is one transaction. A successful repeat is idempotent and returns the linked case's current status.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmIntakeSessionRequest"
      responses:
        "201":
          description: Formal case created, or the linked case returned from an idempotent confirmation retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmIntakeSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: 列出当前用户有成员关系的案件
      description: |
        按案件创建时间倒序返回；没有案件成员关系时返回空数组。全局能力（包括 admin）不会单独授予案件成员关系。
      security:
        - bearerAuth: []
      x-account-types: [member, learner]
      x-data-classification: case-restricted
      responses:
        "200":
          description: 当前用户可访问的案件列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Cases]
      operationId: createCase
      summary: 创建案件和老人资料
      description: |
        member 可以创建案件。服务端生成案件 UUID、AG- 前缀案件编号和 active 初始状态，
        并把创建者作为 family 加入案件。不会自动把任何具备 commander 能力的账号加入案件。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
            example:
              display_name: 模拟老人 A
              age: 76
              gender: female
              physical_description: 短发，行动较慢
              clothing_description: 蓝色外套
              health_notes: 模拟认知障碍信息
              last_seen_at: "2026-07-13T09:00:00Z"
              last_seen_location: 模拟公园北门
      responses:
        "201":
          description: 案件已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCase
      summary: 获取案件详情、老人资料和当前角色可见线索
      description: |
        必须是案件成员。commander 可查看全部线索；family 只能查看已确认线索和本人提交的线索；
        volunteer 只能查看已确认线索，且 elder_profile.health_notes 固定返回 null。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: case-restricted
      responses:
        "200":
          description: 经过服务端角色裁剪的案件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cases/{case_id}/status:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    patch:
      tags: [Cases]
      operationId: updateCaseStatus
      summary: 更新案件状态
      description: |
        仅案件 commander 可以操作。允许 active -> resolved、active -> closed、
        resolved -> active、resolved -> closed，以及相同状态的幂等更新。closed 不能转回其他状态。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseStatusRequest"
            example:
              status: resolved
      responses:
        "200":
          description: 更新后的案件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cases/{case_id}/elder-profile:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    patch:
      tags: [Cases]
      operationId: updateElderProfile
      summary: Supplement or correct a case elder profile
      description: Family and commander members only. Each update stores a revision with actor, timestamp, and before/after snapshots; case status, members, and task fields are rejected. Non-members receive 404.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [family, commander]
      x-data-classification: sensitive
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateElderProfileRequest" } } }
      responses:
        "200": { description: Updated role-cropped case detail, content: { application/json: { schema: { $ref: "#/components/schemas/CaseDetail" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cases/{case_id}/clues:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: listCaseClues
      summary: 获取角色裁剪的线索时间轴
      description: |
        commander 可以查看全部线索；family 只能查看已确认线索和本人提交的线索；
        volunteer 只能查看已确认线索。附件关联仅返回给指挥或线索提交者；分页总数只计算当前角色可见的线索。无案件成员关系返回 404。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: case-restricted
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ClueStatus" }
        - name: source_type
          in: query
          description: Filter by the recorded clue origin without broadening the caller's role-scoped visibility.
          schema: { $ref: "#/components/schemas/ClueSourceType" }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, occurred_at], default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: 角色裁剪后的稳定排序线索页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueTimelinePage"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Cases]
      operationId: createClue
      summary: 向案件提交待审核线索
      description: |
        family、commander 和 volunteer 案件成员均可提交。服务端忽略客户端对状态的控制，
        新线索始终写为 pending_review。closed 案件不能再添加线索。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClueRequest"
            example:
              source: family
              content: 模拟线索：曾向市场方向步行
              occurred_at: "2026-07-13T09:10:00Z"
              location_text: 模拟公园北门
              location_precision: approximate
              raw_record_reference: controlled://intake/record-001
              next_action: 联系现场志愿者核实
      responses:
        "201":
          description: 待审核线索已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clue"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cases/{case_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Tasks]
      operationId: listCaseTasks
      summary: List tasks visible to the current case member
      description: |
        Commanders receive all case tasks. Volunteers receive only tasks assigned to themselves;
        assignment identity is redacted. Family members receive an empty page. The server applies
        role filtering before stable `due_at`, then `id` ordering and pagination. Non-members
        receive 404.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: case-restricted
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Role-filtered, stably ordered task page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tasks]
      operationId: createCaseTask
      summary: Manually create and assign a rescue task
      description: |
        Only a commander of an open case can create this endpoint's initially `assigned` task.
        The source clue must be confirmed and belong to the same case; the recipient must be an
        active case member with the volunteer role. Creation, assignment, and `task.created` /
        `task.assigned` audit events commit in one transaction. No automatic assignment or
        high-risk-action authorization is performed.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Assigned task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tasks/mine:
    get:
      tags: [Tasks]
      operationId: listMyTasks
      summary: List the current volunteer's assigned task queue
      description: |
        This endpoint accepts only accounts with the volunteer capability and returns `200 []`
        when none of their active volunteer case memberships has an assignment. It never accepts
        a case ID and returns no health details, family contact details, full clues, or any other
        volunteer's identity or location history.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-global-capabilities: [volunteer]
      x-data-classification: case-restricted
      responses:
        "200":
          description: The caller's tasks, ordered by due time then task ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tasks/{task_id}/status:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [Tasks]
      operationId: updateTaskStatus
      summary: Advance an assigned task or cancel an unfinished task
      description: |
        The assigned volunteer may advance only `assigned -> accepted -> active -> completed`,
        with `active <-> blocked` available for safety escalation. A case commander may only set
        an unfinished task to `cancelled`. Completed and cancelled tasks are terminal. Every
        successful state change writes a `task.status_changed` audit event containing the prior
        and next status, actor, and timestamp.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander, volunteer]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskStatusRequest" }
      responses:
        "200":
          description: Updated task after an allowed transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tasks/{task_id}/location-reports:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: submitTaskLocationReport
      summary: Submit one simulated location point while executing a task
      description: |
        Only the active task's assigned volunteer may submit a point. The endpoint accepts only
        `simulated` source data, does not accept a device identifier, and is not a background or
        continuous tracking API. The report must be recent (no more than 15 minutes old and no
        more than 5 minutes in the future for clock skew); it is retained for 24 hours from its
        capture time. Exact coordinates and accuracy are stored only in the protected location
        report record, are not returned by this endpoint, and are never copied to audit metadata.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [volunteer]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitTaskLocationReportRequest" }
      responses:
        "201":
          description: Simulated point accepted; the receipt deliberately omits coordinates and accuracy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskLocationReportReceipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tasks/{task_id}/feedback:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: submitTaskFeedback
      summary: Submit an execution feedback clue for review
      description: |
        Only the assigned volunteer may submit feedback while both the task and case are active.
        The server converts the feedback into a `pending_review` field-report clue linked to the
        task. It does not confirm a clue, change case facts, advance the task status, or publish
        a map update. Optional attachments must already belong to the case and have been uploaded
        by the submitting volunteer. The endpoint accepts a textual location only; it does not
        accept coordinates, device identifiers, or continuous tracking data.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [volunteer]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitTaskFeedbackRequest" }
      responses:
        "201":
          description: Feedback was stored as a pending-review clue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskFeedbackReceipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/map-view:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCaseMapView
      summary: 获取按角色裁剪的地图态势
      description: 返回已授权的地点、已确认线索、任务区域和无坐标文字地点回退，不包含预测位置。家属申报的最后出现地点保持 pending_review，客户端依据 object_type 本地化其展示标签；家属不见内部任务；志愿者仅见本人任务和已确认公开地点；非成员返回 404。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      responses:
        "200":
          description: 当前角色完成职责所需的地图项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseMapView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/summary:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCaseSummary
      summary: 获取按角色裁剪的确定性案件摘要
      description: |
        不调用外部 AI 的确定性聚合。仅 `confirmed` 线索会出现在最后确认信息和已确认线索中；
        `pending_review` 与 `needs_verification` 始终单列为待核实事项。指挥可见完整内部摘要，
        家属不接收任务或搜索方向，志愿者仅接收本人任务的必要执行信息。响应包含生成时间和数据来源范围。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      responses:
        "200":
          description: 当前案件角色可见的确定性摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/public-progress:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      tags: [Cases]
      operationId: getCasePublicProgress
      summary: Get family-only reviewed public progress
      description: Returns only human-confirmed progress, the requesting family's own pending items, and safety/contact reminders. It never exposes tasks, internal directions, volunteer locations, membership details, or health-note text.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [family]
      x-data-classification: sensitive
      responses:
        "200": { description: Family-safe public progress, content: { application/json: { schema: { $ref: "#/components/schemas/CasePublicProgress" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cases/{case_id}/clue-drafts:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    post:
      tags: [Cases]
      operationId: createClueDrafts
      summary: Convert controlled text into persisted, unreviewed clue drafts
      description: Stores the original controlled-text reference, template/model metadata, uncertainty notice, and degradation state. The endpoint never creates a formal clue or a confirmed fact; provider unavailability returns a rule-based draft without blocking work.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateClueDraftRequest" } } }
      responses:
        "201": { description: Persisted unreviewed drafts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClueDraft" } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cases/{case_id}/pois:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    get:
      tags: [Cases]
      operationId: listCasePois
      summary: Find bounded nearby resources from a server-authorized center
      description: The caller can choose only an allow-listed category; it cannot submit coordinates. The server performs one bounded nearby search (3 km, one page, at most 10 items) around an authorized task or confirmed place. AMap transport, quota, or business failures return a fixed non-coordinate fallback and never disclose the provider key or source coordinate.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [commander, volunteer]
      x-data-classification: sensitive
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [hospital, police, transit, market, community_service], default: hospital }
      responses:
        "200": { description: Nearby POIs or explicit degraded fallback, content: { application/json: { schema: { $ref: "#/components/schemas/CasePois" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cases/{case_id}/summary-drafts:
    parameters: [{ $ref: "#/components/parameters/CaseId" }]
    post:
      tags: [Cases]
      operationId: createSummaryDraft
      summary: Create a commander-only summary draft
      description: Server-generated drafts are built from the commander's authorized summary scope and start in pending_review. Free-form commander drafts remain internal and are not publication eligible.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: sensitive
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSummaryDraftRequest" } } }
      responses:
        "201": { description: Versioned internal summary draft, content: { application/json: { schema: { $ref: "#/components/schemas/SummaryDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cases/{case_id}/summary-drafts/{draft_id}/review:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Cases]
      operationId: reviewSummaryDraft
      summary: Submit, review, publish, or withdraw a versioned summary draft
      description: Every state transition records operator, reason, and time. Publishing only accepts a server-generated scope-controlled pending_review draft; publishing supersedes older published versions. Review cannot overwrite draft content.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: sensitive
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewSummaryDraftRequest" } } }
      responses:
        "200": { description: Updated versioned summary draft, content: { application/json: { schema: { $ref: "#/components/schemas/SummaryDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cases/{case_id}/places:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: listCasePlaces
      summary: 获取按角色裁剪的关键地点
      description: 服务端按案件角色和审核/可见级别裁剪地点。指挥可见案件内部地点；家属仅见本人提交或已确认的非内部地点；志愿者仅见已确认的公开地点。非成员返回 404。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      responses:
        "200":
          description: 当前角色可见的地点
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CasePlace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Cases]
      operationId: createCasePlace
      summary: 提交常去或关键地点
      description: 仅 family 和 commander 可提交。服务端验证坐标、地点类型和可见级别；新记录固定为 pending_review。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCasePlaceRequest"
      responses:
        "201":
          description: 待审核地点已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasePlace" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [Cases]
      operationId: uploadCaseAttachment
      summary: 上传待审核案件图片
      description: 接受单个 multipart `file`（JPEG/PNG；默认最大 5 MiB，受 ANGUI_ATTACHMENT_MAX_IMAGE_BYTES 配置约束）。服务端会验证实际图片格式并重编码以移除 EXIF/GPS；客户端不得把失败显示为成功。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 待审核图片已存储
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseAttachment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/resource-configuration:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCaseResourceConfiguration
      summary: 获取案件补充资源配置
      description: 返回当前案件成员可使用的图片限制和地点类型。客户端应使用本响应而非内置限制。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      responses:
        "200":
          description: 当前资源配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResourceConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - name: attachment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Cases]
      operationId: downloadCaseAttachment
      summary: 按案件授权下载图片
      description: commander 可下载案件全部附件；family 和 volunteer 只能下载本人提交的附件。附件不经静态目录公开。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      responses:
        "200":
          description: 已授权的图片字节
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/members:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [Cases]
      operationId: addCaseMember
      summary: 按邮箱添加案件成员
      description: |
        family 只能邀请 commander。commander 可以添加 family、commander 或 volunteer。
        `case_role` 是案件内角色；目标账号必须是 member。授予 commander 或 volunteer 时，目标还必须持有同名 `global_capabilities`；family 不需要全局能力。
        learner 不可被加入案件；admin 能力不会产生访问权，但 member 账号可被显式加入案件，且目标账号不能已经属于该案件。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCaseMemberRequest"
            example:
              email: volunteer@demo.invalid
              case_role: volunteer
      responses:
        "201":
          description: 案件成员已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMember"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/clues/{clue_id}/review:
    parameters:
      - $ref: "#/components/parameters/ClueId"
    patch:
      tags: [Clues]
      operationId: reviewClue
      summary: 人工审核线索
      description: |
        仅线索所属案件的 commander 可以操作。接口接受 needs_verification、confirmed、rejected、
        expired 或 duplicate，不接受 pending_review 作为人工审核目标状态。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClueRequest"
            example:
              status: confirmed
      responses:
        "200":
          description: 审核后的线索
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clue"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Angui session token
      description: 登录接口返回的 angui_ 前缀服务端会话令牌。

  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      description: 案件 UUID。没有案件成员关系时通常按未找到处理。
      schema:
        type: string
        format: uuid
    ClueId:
      name: clue_id
      in: path
      required: true
      description: 线索 UUID。
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      description: Case task UUID. Non-members and non-assigned volunteers receive not found.
      schema:
        type: string
        format: uuid
    IntakeSessionId:
      name: session_id
      in: path
      required: true
      description: 问询会话 UUID。非创建者按未找到处理，避免确认会话存在。
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: 请求字段、枚举值或业务输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_error
              message: last_seen_location is required
    Unauthorized:
      description: 缺少会话、Authorization 头无效、会话已过期或已撤销
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: invalid or expired session
    Forbidden:
      description: 用户已认证，但账号角色或案件角色不允许该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: this account cannot perform the requested case action
    NotFound:
      description: 资源不存在，或当前用户没有相应案件成员关系
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: case was not found
    Conflict:
      description: 资源当前状态与请求冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: new clues cannot be added to a closed case
    RateLimited:
      description: 当前进程记录的登录失败次数已超过限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: rate_limited
              message: too many failed login attempts; try again later
    InternalError:
      description: 内部服务或数据库操作失败；不会返回内部 SQL
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: internal service error
            database:
              value:
                error:
                  code: database_error
                  message: database operation failed

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: angui-api
        version:
          type: string
          description: 当前 Cargo package 版本。
          example: 0.1.0

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 会被去除首尾空白并转换为小写；当前服务端仅检查非空、长度和包含 @。
          example: family@demo.invalid
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: 登录密码。失败响应不会区分邮箱、账号状态或密码错误。

    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          pattern: "^angui_[0-9a-f]{64}$"
          description: 只在登录响应中返回一次的原始会话令牌。
          example: angui_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        expires_at:
          type: string
          format: date-time
          description: 服务端会话过期时间。
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, account_type, global_capabilities]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 320
        display_name:
          type: string
        account_type:
          $ref: "#/components/schemas/AccountType"
        global_capabilities:
          type: array
          items:
            $ref: "#/components/schemas/GlobalCapability"

    UserPreferences:
      type: object
      additionalProperties: false
      required: [locale, reduced_motion]
      properties:
        locale: { type: string, enum: [zh-CN, en-US] }
        reduced_motion: { type: boolean }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          additionalProperties: false
          required: [team_name, avatar_reference, preferences]
          properties:
            team_name: { type: [string, "null"] }
            avatar_reference: { type: [string, "null"], maxLength: 500 }
            preferences: { $ref: "#/components/schemas/UserPreferences" }

    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        avatar_reference: { type: string, maxLength: 500 }
        preferences: { $ref: "#/components/schemas/UserPreferences" }

    AccountType:
      type: string
      enum: [member, learner]

    GlobalCapability:
      type: string
      enum: [commander, volunteer, admin]

    CaseRole:
      type: string
      enum: [family, commander, volunteer]

    CaseStatus:
      type: string
      enum: [active, resolved, closed]

    TaskStatus:
      type: string
      enum: [pending_claim, assigned, accepted, active, blocked, completed, cancelled]

    TaskStatusTransitionTarget:
      type: string
      description: `pending_claim` and `assigned` are stored task states, not valid PATCH targets.
      enum: [accepted, active, blocked, completed, cancelled]

    TaskRiskLevel:
      type: string
      enum: [low, medium, high, critical]

    ClueStatus:
      type: string
      enum:
        - pending_review
        - needs_verification
        - confirmed
        - rejected
        - expired
        - duplicate
        - conflicting
        - insufficient_information

    ReviewClueStatus:
      type: string
      enum: [needs_verification, confirmed, rejected, expired, duplicate, conflicting, insufficient_information]

    ClueSourceType:
      type: string
      enum: [manual_report, field_report, chat_draft, ai_draft]

    PublicClueSourceType:
      type: string
      description: 公开成员提交仅允许人工上报或现场反馈。AI/聊天草稿只能由受信任的内部生成流程写入，不能通过此接口声明。
      enum: [manual_report, field_report]

    ClueLocationPrecision:
      type: string
      enum: [exact, approximate, unknown]

    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [display_name, last_seen_location]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: 服务端去除首尾空白后必须为 1 到 120 个字符。
        age:
          type: [integer, "null"]
          minimum: 0
          maximum: 130
        gender:
          type: [string, "null"]
        physical_description:
          type: [string, "null"]
        clothing_description:
          type: [string, "null"]
        health_notes:
          type: [string, "null"]
          description: 敏感字段；volunteer 获取案件详情时服务端固定返回 null。
        last_seen_at:
          type: [string, "null"]
          description: 建议使用 RFC 3339；当前服务端只去除首尾空白，不解析时间格式。
          example: "2026-07-13T09:00:00Z"
        last_seen_location:
          type: string
          minLength: 1
          description: 必填；只包含空白也会被拒绝。

    CreateIntakeSessionRequest:
      type: object
      additionalProperties: false
      properties:
        initial_answers:
          $ref: "#/components/schemas/IntakeInitialAnswers"

    IntakeInitialAnswers:
      type: object
      additionalProperties: false
      properties:
        basic_information: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        health_status: { type: [string, "null"], minLength: 1, description: Sensitive; never included in audit metadata. Limit is configured by the active question definition. }
        behavior_habits: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        last_seen: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        frequent_locations: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        belongings: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        transport_ability: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        follow_up_clues: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }
        suspicious_motive: { type: [string, "null"], minLength: 1, description: Limit is configured by the active question definition. }

    SubmitIntakeAnswerRequest:
      type: object
      additionalProperties: false
      required: [field, answer]
      properties:
        field:
          type: string
          minLength: 1
          description: An enabled field from the session's immutable question-set version.
        answer:
          type: string
          minLength: 1
          description: Trimmed server-side and limited by both the question configuration and the independent hard cap.
        replace:
          type: boolean
          default: false
          description: Set true to correct an existing answer for this field; the current draft is replaced and its prior value is retained as a revision.
        structured:
          oneOf:
            - $ref: "#/components/schemas/IntakeStructuredFacts"
            - type: "null"
          description: Optional structured facts merged into the session draft for rule-based assessments.

    IntakeStructuredFacts:
      type: object
      additionalProperties: false
      properties:
        last_seen_at:
          type: [string, "null"]
          description: Expected as RFC 3339 with an explicit offset. Invalid values are retained as draft input and produce a blocking assessment rather than a request validation error.
        last_seen_location:
          oneOf:
            - $ref: "#/components/schemas/IntakeLocation"
            - type: "null"
        follow_up_at:
          type: [string, "null"]
          description: Expected as RFC 3339 with an explicit offset. Invalid values produce a blocking assessment.
        follow_up_location:
          oneOf:
            - $ref: "#/components/schemas/IntakeLocation"
            - type: "null"
        mobility:
          type: [string, "null"]
          description: Preferred controlled values are limited, independent, or unknown; unsupported values produce a blocking assessment.
        transport_modes:
          type: array
          default: []
          items:
            type: string
          description: Preferred controlled values are walking, driving, public_transit, or unknown; unsupported values produce a blocking assessment.
        companion_status:
          type: [string, "null"]
          description: Preferred controlled values are alone, accompanied, or unknown; unsupported values produce a blocking assessment.
        belongings:
          type: array
          default: []
          items:
            type: string

    IntakeLocation:
      type: object
      additionalProperties: false
      required: [name, longitude, latitude, coordinate_system]
      properties:
        name: { type: string }
        longitude: { type: number, minimum: -180, maximum: 180 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        coordinate_system: { type: string, description: Route estimates require gcj02; other values produce an informational assessment. }

    IntakeCandidateField:
      type: object
      additionalProperties: false
      required: [field, value, source, status, generated_at, model, template_version, source_text, confidence]
      properties:
        field: { type: string }
        value: { type: string, description: Unconfirmed candidate value; it is not a formal case fact. }
        source: { type: string, enum: [family_provided, ai_extracted] }
        status: { type: string, const: draft }
        generated_at: { type: string, format: date-time }
        model: { type: [string, "null"], description: Null for the current rule-based path. }
        template_version: { type: [string, "null"], description: Null for the current rule-based path. }
        source_text: { type: string, description: Original raw answer from which the unconfirmed candidate was produced. }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1, description: Null for the current rule-based path. }

    IntakeRouteEstimate:
      type: object
      additionalProperties: false
      required: [distance_meters, available_seconds, minimum_seconds, basis, degraded]
      properties:
        distance_meters: { type: integer, minimum: 0 }
        available_seconds: { type: integer }
        minimum_seconds: { type: [integer, "null"], minimum: 0 }
        basis: { type: string, description: Routing provider name or a straight-line fallback reason. }
        degraded: { type: boolean, description: True when the estimate was produced from a fallback rather than a route provider. }

    IntakeAssessment:
      type: object
      additionalProperties: false
      required: [field_path, conflict_type, severity, evidence_summary, suggested_action, route_estimate]
      properties:
        field_path: { type: string, description: Path of the draft field that needs review. }
        conflict_type: { type: string, description: Machine-readable rule result identifier. }
        severity: { type: string, enum: [blocking, warning, info] }
        evidence_summary: { type: string }
        suggested_action: { type: string }
        route_estimate:
          oneOf:
            - $ref: "#/components/schemas/IntakeRouteEstimate"
            - type: "null"

    SubmitIntakeAnswerResponse:
      type: object
      additionalProperties: false
      required: [session_id, status, raw_answer, candidate_fields, missing_fields, phase, completed_phase_one_fields, missing_phase_one_fields, phase_transition_ready, assessments, next_question, guidance_mode, privacy_notice, updated_at]
      properties:
        session_id: { type: string, format: uuid }
        status: { type: string, enum: [collecting, ready_for_confirmation] }
        raw_answer: { type: string, description: Original free-text response, separate from candidate fields. }
        candidate_fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/IntakeCandidateField"
        missing_fields:
          type: array
          items: { type: string }
        phase: { type: string, enum: [phase_one, phase_two] }
        completed_phase_one_fields:
          type: array
          items: { type: string }
        missing_phase_one_fields:
          type: array
          items: { type: string }
        phase_transition_ready: { type: boolean }
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/IntakeAssessment"
        next_question:
          oneOf:
            - $ref: "#/components/schemas/IntakeQuestion"
            - type: "null"
        guidance_mode: { type: string, const: rule_based }
        privacy_notice: { type: string }
        updated_at: { type: string, format: date-time }

    IntakeProfileDraft:
      type: object
      additionalProperties: false
      required: [status, source_scope, generated_at, requires_human_confirmation, profile, field_metadata, missing_fields, assessments, confirmation_blocked_reasons, direction_hypotheses]
      properties:
        status: { type: string, const: draft }
        source_scope: { type: string }
        generated_at: { type: string, format: date-time }
        requires_human_confirmation: { type: boolean, const: true }
        profile: { $ref: "#/components/schemas/IntakeProfileDraftFields" }
        field_metadata:
          type: array
          items:
            $ref: "#/components/schemas/IntakeProfileDraftFieldMetadata"
        missing_fields:
          type: array
          items: { type: string }
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/IntakeAssessment"
        confirmation_blocked_reasons:
          type: array
          items: { type: string }
        direction_hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/IntakeDirectionHypothesis"

    IntakeProfileDraftFieldMetadata:
      type: object
      additionalProperties: false
      required: [field, source_field, source, status, generated_at]
      properties:
        field: { type: string, description: Display field in profile. }
        source_field: { type: string, description: Intake answer field that supplied the display value. }
        source: { type: string, enum: [family_provided, ai_extracted] }
        status: { type: string, const: draft }
        generated_at: { type: string, format: date-time }

    IntakeProfileDraftFields:
      type: object
      additionalProperties: false
      required: [physical_description, clothing_description, health_notes, mobility_notes, transportation_ability, frequent_locations, last_seen_information, behavior_habits, suspicious_motive]
      properties:
        physical_description: { type: [string, "null"] }
        clothing_description: { type: [string, "null"] }
        health_notes: { type: [string, "null"] }
        mobility_notes: { type: [string, "null"] }
        transportation_ability: { type: [string, "null"] }
        frequent_locations: { type: [string, "null"] }
        last_seen_information: { type: [string, "null"] }
        behavior_habits: { type: [string, "null"] }
        suspicious_motive: { type: [string, "null"] }

    IntakeDirectionHypothesis:
      type: object
      additionalProperties: false
      required: [status, source_fields, generated_at, uncertainty_notice, description]
      properties:
        status: { type: string, const: hypothesis }
        source_fields:
          type: array
          items: { type: string }
        generated_at: { type: string, format: date-time }
        uncertainty_notice: { type: string }
        description: { type: string }

    ConfirmIntakeSessionRequest:
      type: object
      additionalProperties: false
      required: [profile, human_confirmed]
      properties:
        human_confirmed: { type: boolean, const: true }
        profile: { $ref: "#/components/schemas/ConfirmedIntakeProfile" }

    ConfirmedIntakeProfile:
      type: object
      additionalProperties: false
      required: [display_name, last_seen_location]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        age: { type: [integer, "null"], minimum: 0, maximum: 130 }
        gender: { type: [string, "null"] }
        physical_description: { type: [string, "null"] }
        clothing_description: { type: [string, "null"] }
        health_notes: { type: [string, "null"] }
        last_seen_at: { type: [string, "null"], description: Trimmed server-side but not parsed or format-validated during confirmation. }
        last_seen_location: { type: string, minLength: 1 }

    ConfirmIntakeSessionResponse:
      type: object
      additionalProperties: false
      required: [case_id, case_code, status, confirmation_status, confirmed_at]
      properties:
        case_id: { type: string, format: uuid }
        case_code: { type: string }
        status:
          $ref: "#/components/schemas/CaseStatus"
          description: Active on first confirmation; an idempotent retry returns the linked case's current status.
        confirmation_status: { type: string, const: human_confirmed }
        confirmed_at: { type: string, format: date-time }

    IntakeQuestion:
      type: object
      additionalProperties: false
      required: [field, prompt, required]
      properties:
        field: { type: string }
        prompt: { type: string }
        required: { type: boolean }

    IntakeSession:
      type: object
      additionalProperties: false
      required: [id, status, question_set_version, initial_answers, missing_fields, phase, completed_phase_one_fields, missing_phase_one_fields, phase_transition_ready, next_question, guidance_mode, privacy_notice, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [collecting, ready_for_confirmation] }
        question_set_version: { type: integer, minimum: 1 }
        initial_answers: { $ref: "#/components/schemas/IntakeInitialAnswers" }
        missing_fields:
          type: array
          items: { type: string }
        phase: { type: string, enum: [phase_one, phase_two] }
        completed_phase_one_fields:
          type: array
          items: { type: string }
        missing_phase_one_fields:
          type: array
          items: { type: string }
        phase_transition_ready: { type: boolean }
        next_question:
          oneOf:
            - $ref: "#/components/schemas/IntakeQuestion"
            - type: "null"
        guidance_mode: { type: string, const: rule_based }
        privacy_notice: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateCaseStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CaseStatus"

    UpdateElderProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        age: { type: integer, minimum: 0, maximum: 130 }
        gender: { type: string, maxLength: 64 }
        physical_description: { type: string, maxLength: 2000 }
        clothing_description: { type: string, maxLength: 2000 }
        health_notes: { type: string, maxLength: 2000 }
        last_seen_at: { type: string, format: date-time }
        last_seen_location: { type: string, maxLength: 500 }

    CreateClueRequest:
      type: object
      additionalProperties: false
      required: [source, content]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: 服务端去除首尾空白后必须为 1 到 64 个字符。
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 服务端去除首尾空白后必须为 1 到 4000 个字符。
        source_type:
          $ref: "#/components/schemas/PublicClueSourceType"
          default: manual_report
        raw_record_reference:
          type: [string, "null"]
          maxLength: 500
          description: 仅指挥和线索提交者可见的受控原始记录引用；其他已授权协作角色会收到 null，且普通审计元数据不复制原文。
        occurred_at:
          type: [string, "null"]
          description: 建议使用 RFC 3339；当前服务端只去除首尾空白，不解析时间格式。
        location_text:
          type: [string, "null"]
        location_precision:
          anyOf:
            - $ref: "#/components/schemas/ClueLocationPrecision"
            - type: "null"
        next_action:
          type: [string, "null"]
          maxLength: 500
        linked_task_reference:
          type: [string, "null"]
          maxLength: 120
        attachment_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    ReviewClueRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/ReviewClueStatus"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 人工审核理由，会与操作者及前后状态一起进入审计记录。
        related_clue_id:
          type: [string, "null"]
          format: uuid
          description: duplicate 或 conflicting 状态必须引用同案另一条线索。
        relationship_type:
          type: [string, "null"]
          enum: [duplicate_of, conflicts_with, null]
        next_action:
          type: [string, "null"]
          maxLength: 500
        linked_task_reference:
          type: [string, "null"]
          maxLength: 120

    AddCaseMemberRequest:
      type: object
      additionalProperties: false
      required: [email, case_role]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 目标活动账号邮箱；服务端转换为小写并去除首尾空白。
        case_role:
          $ref: "#/components/schemas/CaseRole"

    CaseMember:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, account_type, global_capabilities, case_role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        account_type:
          $ref: "#/components/schemas/AccountType"
        global_capabilities:
          type: array
          items:
            $ref: "#/components/schemas/GlobalCapability"
        case_role:
          $ref: "#/components/schemas/CaseRole"

    CaseListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - case_code
        - status
        - access_role
        - display_name
        - last_seen_at
        - last_seen_location
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        case_code:
          type: string
          pattern: "^AG-[0-9A-F]{8}$"
        status:
          $ref: "#/components/schemas/CaseStatus"
        access_role:
          $ref: "#/components/schemas/CaseRole"
        display_name:
          type: string
        last_seen_at:
          type: [string, "null"]
        last_seen_location:
          type: [string, "null"]
          description: 仅返回给当前案件成员的最后出现地点；客户端不得将其用于公开展示。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CaseDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - case_code
        - status
        - access_role
        - elder_profile
        - clues
        - places
        - attachments
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        case_code:
          type: string
          pattern: "^AG-[0-9A-F]{8}$"
        status:
          $ref: "#/components/schemas/CaseStatus"
        access_role:
          $ref: "#/components/schemas/CaseRole"
        elder_profile:
          $ref: "#/components/schemas/ElderProfile"
        clues:
          type: array
          description: 根据当前案件角色裁剪后的线索列表，按创建时间倒序。
          items:
            $ref: "#/components/schemas/Clue"
        places:
          type: array
          description: 按案件角色和可见级别裁剪后的地点；所有新提交记录均待人工审核。
          items:
            $ref: "#/components/schemas/CasePlace"
        attachments:
          type: array
          description: 指挥可查看案件附件；其他成员仅看到本人提交的附件元数据。
          items:
            $ref: "#/components/schemas/CaseAttachment"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ElderProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - age
        - gender
        - physical_description
        - clothing_description
        - health_notes
        - last_seen_at
        - last_seen_location
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        age:
          type: [integer, "null"]
          minimum: 0
          maximum: 130
        gender:
          type: [string, "null"]
        physical_description:
          type: [string, "null"]
        clothing_description:
          type: [string, "null"]
        health_notes:
          type: [string, "null"]
          description: volunteer 响应中为 null；其他角色按数据库值返回。
        last_seen_at:
          type: [string, "null"]
        last_seen_location:
          type: [string, "null"]

    Clue:
      type: object
      additionalProperties: false
      required:
        - id
        - case_id
        - status
        - source
        - source_type
        - content
        - raw_record_reference
        - occurred_at
        - reported_at
        - confirmed_at
        - location_text
        - location_precision
        - next_action
        - linked_task_reference
        - related_clue_id
        - relationship_type
        - review_reason
        - attachment_ids
        - created_at
        - updated_at
        - reviewed_at
        - is_own_submission
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ClueStatus"
        source:
          type: string
          maxLength: 64
        source_type:
          $ref: "#/components/schemas/ClueSourceType"
        content:
          type: string
          maxLength: 4000
        raw_record_reference:
          type: [string, "null"]
        occurred_at:
          type: [string, "null"]
        reported_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        location_text:
          type: [string, "null"]
        location_precision:
          anyOf:
            - $ref: "#/components/schemas/ClueLocationPrecision"
            - type: "null"
        next_action:
          type: [string, "null"]
        linked_task_reference:
          type: [string, "null"]
        related_clue_id:
          type: [string, "null"]
          format: uuid
        relationship_type:
          type: [string, "null"]
          enum: [duplicate_of, conflicts_with, null]
        review_reason:
          type: [string, "null"]
        attachment_ids:
          type: array
          description: 仅在当前用户是指挥或线索提交者时返回；文件下载仍独立进行服务端权限校验。
          items: { type: string, format: uuid }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reviewed_at:
          type: [string, "null"]
          format: date-time
          description: 未经人工审核时为 null。响应不会返回审核人的身份信息。
        is_own_submission:
          type: boolean
          description: 当前认证用户是否为该线索的提交者。

    ClueTimelinePage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Clue" }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          minimum: 0
          description: Only clues visible to the authenticated user are counted.

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [source_clue_id, volunteer_user_id, title, objective, area_text, due_at, background, risk_level, risk_notes, safety_briefing, expected_feedback]
      properties:
        source_clue_id:
          type: string
          format: uuid
          description: A confirmed clue in the same case; required as the task's reviewed source evidence.
        volunteer_user_id:
          type: string
          format: uuid
          description: An active volunteer member of the same case; the server does not auto-select one.
        title: { type: string, minLength: 1, maxLength: 200 }
        objective: { type: string, minLength: 1, maxLength: 4000 }
        area_text: { type: string, minLength: 1, maxLength: 500 }
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
          description: Must be provided with longitude, or both coordinates must be omitted or null.
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
          description: Must be provided with latitude, or both coordinates must be omitted or null.
        due_at:
          type: string
          format: date-time
          description: Required future RFC 3339 timestamp; the server normalizes it to UTC.
        background: { type: string, minLength: 1, maxLength: 10000 }
        risk_level: { $ref: "#/components/schemas/TaskRiskLevel" }
        risk_notes: { type: string, minLength: 1, maxLength: 4000 }
        safety_briefing: { type: string, minLength: 1, maxLength: 4000 }
        expected_feedback: { type: string, minLength: 1, maxLength: 4000 }

    UpdateTaskStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TaskStatusTransitionTarget"
          description: The current task state and caller role determine whether this otherwise valid target transition is allowed.

    SubmitTaskLocationReportRequest:
      type: object
      additionalProperties: false
      required: [source, latitude, longitude, accuracy_meters, captured_at]
      properties:
        source:
          type: string
          const: simulated
          description: The only accepted source. Device IDs and continuous background tracking are unsupported.
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_meters: { type: number, minimum: 0, maximum: 10000 }
        captured_at:
          type: string
          format: date-time
          description: Required RFC 3339 time; must be at most 15 minutes old and at most 5 minutes in the future.

    TaskLocationReportReceipt:
      type: object
      additionalProperties: false
      required: [id, source, captured_at, retention_expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, const: simulated }
        captured_at: { type: string, format: date-time }
        retention_expires_at:
          type: string
          format: date-time
          description: Server-derived 24-hour retention deadline for this protected location record.
        created_at: { type: string, format: date-time }

    SubmitTaskFeedbackRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Field observation that remains unconfirmed until commander review.
        occurred_at:
          type: [string, "null"]
          format: date-time
        location_text:
          type: [string, "null"]
          maxLength: 500
          description: Optional human-readable place description; exact coordinates are unsupported.
        location_precision:
          type: [string, "null"]
          enum: [exact, approximate, unknown, null]
          description: Requires location_text when supplied.
        attachment_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    TaskFeedbackReceipt:
      type: object
      additionalProperties: false
      required: [task_id, clue_id, status, submitted_at]
      properties:
        task_id: { type: string, format: uuid }
        clue_id: { type: string, format: uuid }
        status: { type: string, const: pending_review }
        submitted_at: { type: string, format: date-time }

    Task:
      type: object
      additionalProperties: false
      required: [id, case_id, source_clue_id, title, objective, area_text, latitude, longitude, due_at, background, risk_level, risk_notes, safety_briefing, expected_feedback, status, result_summary, assigned_volunteer_user_id, assigned_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        source_clue_id:
          type: [string, "null"]
          format: uuid
          description: Returned to commanders only; it is null in volunteer responses.
        title: { type: string, maxLength: 200 }
        objective: { type: string, maxLength: 4000 }
        area_text: { type: string, maxLength: 500 }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        due_at: { type: string, format: date-time }
        background:
          type: [string, "null"]
          description: Internal task context returned to commanders only; it is null in volunteer responses.
        risk_level: { $ref: "#/components/schemas/TaskRiskLevel" }
        risk_notes: { type: string }
        safety_briefing: { type: string }
        expected_feedback: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        result_summary: { type: [string, "null"] }
        assigned_volunteer_user_id:
          type: [string, "null"]
          format: uuid
          description: Returned to commanders only; it is null in volunteer responses.
        assigned_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskListPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          minimum: 0
          description: Only tasks visible to the authenticated case role are counted.

    CreateCasePlaceRequest:
      type: object
      additionalProperties: false
      required: [name, place_type, address, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        place_type: { type: string, description: Value must appear in the current case resource configuration. }
        address: { type: string, minLength: 1, maxLength: 500 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        visibility: { type: string, enum: [public, confirmed, internal] }

    CaseMapView:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaseMapItem" }

    CaseMapItem:
      type: object
      additionalProperties: false
      required: [id, object_type, display_name, longitude, latitude, location_text, location_precision, source, occurred_at, reported_at, review_status, related_task_id, updated_at]
      properties:
        id: { type: string }
        object_type: { type: string, enum: [last_seen, place, clue, task] }
        display_name:
          type: [string, "null"]
          description: 对象自身名称；last_seen 为 null，客户端必须依据 object_type 本地化展示标签。
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        location_text: { type: [string, "null"] }
        location_precision: { type: string, enum: [exact, unknown, approximate] }
        source: { type: string }
        occurred_at: { type: [string, "null"], format: date-time }
        reported_at: { type: [string, "null"], format: date-time }
        review_status: { type: string }
        related_task_id: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }

    CasePublicProgressItem:
      type: object
      additionalProperties: false
      required: [clue_id, content, review_status, updated_at]
      properties:
        clue_id: { type: string, format: uuid }
        content: { type: string }
        review_status: { type: string, enum: [pending_review, needs_verification, confirmed] }
        updated_at: { type: string, format: date-time }

    CasePublicProgress:
      type: object
      additionalProperties: false
      required: [case_id, status, generated_at, confirmed_progress, requested_family_information, safety_and_contact_reminders]
      properties:
        case_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CaseStatus" }
        generated_at: { type: string, format: date-time }
        confirmed_progress: { type: array, items: { $ref: "#/components/schemas/CasePublicProgressItem" } }
        requested_family_information: { type: array, items: { $ref: "#/components/schemas/CasePublicProgressItem" } }
        safety_and_contact_reminders: { type: array, items: { type: string } }

    CreateClueDraftRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        source_type: { type: string, enum: [manual_report, field_report], default: manual_report }
        raw_record_reference: { type: string, minLength: 1, maxLength: 500 }

    ClueDraft:
      type: object
      additionalProperties: false
      required: [id, case_id, status, content, source_type, uncertainty_notice, template_version, provider_model, degradation_status]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review] }
        content: { type: string }
        source_type: { type: string, enum: [manual_report, field_report] }
        raw_record_reference: { type: [string, "null"] }
        occurred_at: { type: [string, "null"], format: date-time }
        location_text: { type: [string, "null"] }
        uncertainty_notice: { type: string }
        template_version: { type: string }
        provider_model: { type: [string, "null"] }
        degradation_status: { type: string, enum: [manual_review_required, rule_based_fallback] }

    CasePoi:
      type: object
      additionalProperties: false
      required: [id, name, category, address, longitude, latitude]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [hospital, police, transit, market, community_service] }
        address: { type: [string, "null"] }
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }

    CasePois:
      type: object
      additionalProperties: false
      required: [items, source, degradation_status, fallback_message]
      properties:
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CasePoi" } }
        source: { type: string, enum: [amap_webservice, fixed_demo_fallback] }
        degradation_status: { type: string, enum: [available, degraded] }
        fallback_message: { type: [string, "null"] }

    CreateSummaryDraftRequest:
      type: object
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 12000, description: Internal-only commander draft content; it is never publication eligible. }

    ReviewSummaryDraftRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { type: string, enum: [submit, publish, reject, withdraw] }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    SummaryDraft:
      type: object
      additionalProperties: false
      required: [id, case_id, status, content, source_scope, template_version, provider_model, generated_at, reviewed_at, review_reason, created_at, updated_at, publication_eligible]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review, published, rejected, withdrawn, superseded] }
        content: { type: string }
        source_scope: { type: array, items: { type: string } }
        template_version: { type: string }
        provider_model: { type: [string, "null"] }
        generated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        publication_eligible: { type: boolean }

    CaseSummary:
      type: object
      additionalProperties: false
      required: [case_id, access_role, generated_at, source_scope, last_confirmed_information, confirmed_clues, pending_verification, excluded_directions, current_focus, task_status, safety_reminders]
      properties:
        case_id: { type: string, format: uuid }
        access_role: { $ref: "#/components/schemas/CaseRole" }
        generated_at: { type: string, format: date-time }
        source_scope:
          type: array
          description: Machine-readable list of the authorized data categories used for this role's summary.
          items: { type: string }
        last_confirmed_information:
          oneOf:
            - $ref: "#/components/schemas/CaseSummaryClue"
            - type: "null"
          description: Most recently reported confirmed clue; never an unreviewed profile assertion or clue.
        confirmed_clues:
          type: array
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        pending_verification:
          type: array
          description: Items remain unverified and must not be presented as confirmed facts.
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        excluded_directions:
          type: array
          description: Commander-only non-confirmed directions with an exclusion status.
          items: { $ref: "#/components/schemas/CaseSummaryClue" }
        current_focus:
          type: array
          description: Commander-only active search directions derived from unfinished tasks.
          items: { $ref: "#/components/schemas/CaseSummaryFocus" }
        task_status:
          type: array
          description: Commander receives all tasks; volunteer receives only their assigned tasks; family receives none.
          items: { $ref: "#/components/schemas/CaseSummaryTask" }
        safety_reminders:
          type: array
          items: { type: string }

    CaseSummaryClue:
      type: object
      additionalProperties: false
      required: [clue_id, content, status, occurred_at, reported_at]
      properties:
        clue_id: { type: string, format: uuid }
        content: { type: string }
        status: { type: string }
        occurred_at: { type: [string, "null"], format: date-time }
        reported_at: { type: string, format: date-time }

    CaseSummaryFocus:
      type: object
      additionalProperties: false
      required: [task_id, title, objective, area_text, status]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        area_text: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }

    CaseSummaryTask:
      type: object
      additionalProperties: false
      required: [task_id, title, objective, area_text, due_at, status, safety_briefing]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        area_text: { type: string }
        due_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/TaskStatus" }
        safety_briefing: { type: string }

    CasePlace:
      type: object
      additionalProperties: false
      required: [id, case_id, name, place_type, address, longitude, latitude, source, visibility, review_status, created_at, updated_at, is_own_submission]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        name: { type: string }
        place_type: { type: string }
        address: { type: string }
        longitude: { type: [number, "null"] }
        latitude: { type: [number, "null"] }
        source: { type: string, enum: [family, commander, volunteer], description: Set by the server from the submitter's case role. }
        visibility: { type: string, enum: [public, confirmed, internal] }
        review_status: { type: string, enum: [pending_review, confirmed, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_own_submission: { type: boolean }

    CaseAttachment:
      type: object
      additionalProperties: false
      required: [id, case_id, original_filename, content_type, byte_size, source, review_status, created_at, updated_at, is_own_submission]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        original_filename: { type: string, maxLength: 104 }
        content_type: { type: string, enum: [image/jpeg, image/png] }
        byte_size: { type: integer, minimum: 1, description: 默认最大 5242880；实际值由 ANGUI_ATTACHMENT_MAX_IMAGE_BYTES 配置。 }
        source: { type: string, enum: [family, commander, volunteer] }
        review_status: { type: string, enum: [pending_review, confirmed, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_own_submission: { type: boolean }

    CaseResourceConfiguration:
      type: object
      additionalProperties: false
      required: [attachment_max_image_bytes, attachment_max_per_case, case_place_types]
      properties:
        attachment_max_image_bytes: { type: integer, minimum: 1024 }
        attachment_max_per_case: { type: integer, minimum: 1 }
        case_place_types:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - internal_error
            - database_error
        message:
          type: string
