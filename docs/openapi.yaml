        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewTaskApplicationRequest" } } }
      responses:
        "200": { description: Reviewed application, content: { application/json: { schema: { $ref: "#/components/schemas/TaskApplication" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
