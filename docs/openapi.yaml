        - name: browser_latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: selection_token
          in: query
          required: true
          description: Short-lived token returned with the selected POI by listCasePois.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "200": { description: Walking route estimate or straight-line fallback, content: { application/json: { schema: { $ref: "#/components/schemas/CasePoiRoute" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

