      description: Commander and volunteer only. Browser coordinates are WGS-84 and are used only for this request. A short-lived selection token from listCasePois identifies a selected AMap POI and is bound to the caller and case, preventing arbitrary destination routing. The server converts the browser coordinate before requesting an AMap walking estimate and returns a straight-line fallback when route estimation is unavailable. Neither coordinate is persisted or written to audit metadata.
      security: [{ bearerAuth: [] }]
