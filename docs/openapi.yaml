        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartIntakeAiInitialReviewRequest" }
      responses:
        "201": { description: Family review draft stream; only the final completed event contains the review result, content: { text/event-stream: { schema: { type: string } } } }
