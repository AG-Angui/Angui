        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/resource-configuration:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCaseResourceConfiguration
      summary: 获取案件补充资源配置
      description: 返回当前案件成员可使用的图片限制和地点类型。客户端应使用本响应而非内置限制。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      responses:
        "200":
          description: 当前资源配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResourceConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - name: attachment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Cases]
      operationId: downloadCaseAttachment
      summary: 按案件授权下载图片
      description: commander 可下载案件全部附件；family 和 volunteer 只能下载本人提交的附件。附件不经静态目录公开。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: sensitive
      responses:
        "200":
          description: 已授权的图片字节
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cases/{case_id}/members:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: listCaseMembers
      summary: List members available to the case commander
      description: Returns only the current case's members to a commander of that case. It is used to review collaboration and manually select an already-authorized volunteer when creating a task; it does not search global accounts or disclose members of other cases.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: case-restricted
      responses:
        "200":
          description: Case members with their current case role and global capabilities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Cases]
      operationId: addCaseMember
      summary: 按邮箱添加案件成员
      description: |
        family 只能邀请 commander。commander 可以添加 family、commander 或 volunteer。
        `case_role` 是案件内角色；目标账号必须是 member。授予 commander 或 volunteer 时，目标还必须持有同名 `global_capabilities`；family 不需要全局能力。
        learner 不可被加入案件；admin 能力不会产生访问权，但 member 账号可被显式加入案件，且目标账号不能已经属于该案件。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCaseMemberRequest"
            example:
              email: volunteer@demo.invalid
              case_role: volunteer
      responses:
        "201":
          description: 案件成员已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMember"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/clues/{clue_id}/review:
    parameters:
      - $ref: "#/components/parameters/ClueId"
    patch:
      tags: [Clues]
      operationId: reviewClue
      summary: 人工审核线索
      description: |
        仅线索所属案件的 commander 可以操作。接口接受 needs_verification、confirmed、rejected、
        expired 或 duplicate，不接受 pending_review 作为人工审核目标状态。
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [commander]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClueRequest"
            example:
              status: confirmed
      responses:
        "200":
          description: 审核后的线索
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clue"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/clues/{clue_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/ClueId"
    post:
      tags: [Clues]
      operationId: uploadClueAttachment
      summary: Upload pending-review image evidence for one clue
      description: Accepts exactly one multipart file (JPEG or PNG). The server verifies actual format, re-encodes the image to remove EXIF/GPS metadata, creates a pending_review attachment, links it to the clue, and audits the operation atomically. Commanders may attach evidence to any clue in their case; family and volunteers may only attach to clues they submitted. Attachments remain case-restricted and are never exposed through public progress.
      security:
        - bearerAuth: []
      x-account-types: [member]
      x-case-roles: [family, commander, volunteer]
      x-data-classification: case-restricted
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": { description: Pending-review image evidence linked to the clue, content: { application/json: { schema: { $ref: "#/components/schemas/CaseAttachment" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      summary: List sanitized audit events
      description: Admin capability only. Supports bounded filtering by case, entity type, event action, and RFC 3339 time range. The response intentionally excludes metadata_json and all raw sensitive payloads. Every access is audited.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-audit
      parameters:
        - { name: case_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string, maxLength: 128 } }
        - { name: action, in: query, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, action, entity_type], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Sanitized audit event page, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAuditEventPage" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/access-requests:
    get:
      tags: [Access requests]
      operationId: listAccessRequests
      summary: 列出账号访问申请
      description: 仅平台管理员可调用。返回申请审核所需的账号信息和邮箱验证状态，不返回验证令牌、审核理由或密码相关数据。
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      responses:
        "200": { description: 按创建时间倒序的账号访问申请列表, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminAccessRequest" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/admin/access-requests/{request_id}/review:
    parameters:
      - name: request_id
        in: path
