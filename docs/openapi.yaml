        description: 账号访问申请 UUID。
        schema: { type: string, format: uuid }
    patch:
      tags: [Access requests]
      operationId: reviewAccessRequest
      summary: 审核账号访问申请
      description: 仅平台管理员可调用，且申请必须已完成邮箱验证并处于 `pending_review`。批准时服务端创建停用账户并发送一次性密码设置链接；拒绝时必须提供审核理由。管理员不能通过该接口授予管理员能力。
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewAccessRequest" }
      responses:
        "200": { description: 已审核的账号访问申请, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccessRequest" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: List account status without credentials
      description: Admin capability only. Returns account identity, account type, global capabilities, status, creation time, and last session time. Password hashes, session tokens, profiles, and case data are never returned. Every access is audited.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      parameters:
        - { name: account_type, in: query, schema: { type: string, enum: [member, learner] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled, locked] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, email, last_session_at], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Sanitized account page, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserPage" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{user_id}/status:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      operationId: updateAdminUserStatus
      summary: Enable, disable, or lock an account
      description: Admin capability only. Only active, disabled, and locked are accepted. Disabling or locking revokes every active session in the same transaction. The audit records actor, previous and next status, revocation count, and reason length; it never stores the reason text or credentials.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAdminUserStatusRequest" } } }
      responses:
        "200": { description: Updated sanitized account, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/archive-drafts:
    get:
      tags: [Admin]
      operationId: listAdminArchiveDrafts
      summary: List controlled archive drafts awaiting or retaining administrator review
      description: Admin capability only. Returns lifecycle metadata and controlled draft content; it does not expose source chats, exact trajectories, attachments, or unreviewed clues.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      responses:
        "200": { description: Controlled archive drafts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ArchiveDraft" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/archive-drafts/{draft_id}/deidentify:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      operationId: deidentifyArchiveDraft
      summary: Record manual de-identification review
      description: Admin capability only. This endpoint records a human confirmation or rejection of de-identification for a controlled archive draft. It never accepts replacement text, raw source material, or an automated de-identification claim. Confirmation moves the draft to pending_review; rejection prevents publication. Every outcome is audited without recording the reason text.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeidentifyArchiveDraftRequest" } } }
      responses:
        "200": { description: Archive draft with its updated controlled lifecycle state, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/archive-drafts/{draft_id}/review:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      operationId: reviewArchiveDraft
      summary: Publish, reject, or withdraw a reviewed archive draft
      description: Admin capability only. Publication is allowed only after recorded manual de-identification confirmation. Publishing only marks a controlled archive as a learning_resource; it does not expose a RAG, export, print, public, or cross-case read path. Withdrawal immediately removes that learning-resource designation while preserving the auditable version history.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewArchiveDraftRequest" } } }
      responses:
        "200": { description: Archive draft with its updated controlled lifecycle state, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/archive-drafts/{draft_id}/review-materials:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin]
      operationId: listArchiveReviewMaterials
      summary: List immutable archive review-material versions
      description: Admin capability only. Returns the version chain, source-scope metadata, review state, and the de-identified material currently selected as the AI input. Raw source records are never returned by this endpoint.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      responses:
        "200": { description: Archive review-material versions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ArchiveReviewMaterial" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/archive-drafts/{draft_id}/review-materials/diff/{from_version}/{to_version}:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: from_version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: to_version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Admin]
      operationId: diffArchiveReviewMaterials
      summary: Compare two archive review-material versions
      description: Admin capability only. Returns line-level additions and removals without mutating either immutable material version.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      responses:
        "200": { description: Material version diff, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveReviewMaterialDiff" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/archive-drafts/{draft_id}/review-materials/{version}/restore:
    parameters:
      - name: draft_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [Admin]
      operationId: restoreArchiveReviewMaterial
      summary: Restore an approved material version as a new immutable version
      description: Admin capability only. The selected de-identified version is copied into a new version with a parent link, the archive draft points to that new version, and the draft returns to pending_review. No historical row is mutated.
      security: [{ bearerAuth: [] }]
      x-account-types: [member]
      x-global-capabilities: [admin]
      x-data-classification: restricted-admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RestoreArchiveReviewMaterialRequest" } } }
      responses:
        "200": { description: Archive draft regenerated from the restored approved material, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/learning/public/prevention-card:
    get:
      tags: [Learning]
      operationId: getPublicPreventionCard
      summary: Get the approved public prevention card for offline use
      description: Returns the current effective prevention resource only when it is public, published, training- or public-information-scoped, and has a complete immutable governance chain. A withdrawn card is not returned.
